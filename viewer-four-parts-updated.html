<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>4 parts — updated core + ceramic</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#e8e8ec; overflow:hidden; font-family:-apple-system, sans-serif; }
canvas { display:block; width:100vw; height:100vh; }
.tag { position:fixed; top:14px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.8); color:#fff; padding:8px 20px; border-radius:9px; font-size:15px; font-weight:600; z-index:5; }
.legend { position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.66); color:#eee; padding:9px 16px; border-radius:8px; font-size:12.5px; z-index:5; text-align:center; }
#loading { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); font-size:18px; color:#666; z-index:20; }
button { position:fixed; top:52px; left:50%; transform:translateX(-50%); z-index:6; background:#2f7fd6; color:#fff; border:none; padding:6px 16px; border-radius:7px; font-size:13px; cursor:pointer; }
</style>
</head>
<body>
<div class="tag">The 4 parts — NEW bolt-together core with ceramic (others unchanged)</div>
<button id="exp">Separate core pieces</button>
<div id="loading">Loading…</div>
<div class="legend">Bottom Cap &nbsp;·&nbsp; NEW Core (tubes + 2 rings + flange + support plate + screws + ceramic) &nbsp;·&nbsp; Top Cap &nbsp;·&nbsp; Lid &nbsp;—&nbsp; drag to rotate</div>
<canvas id="c"></canvas>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

THREE.Object3D.DEFAULT_UP.set(0,0,1);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setPixelRatio(devicePixelRatio); renderer.setClearColor(0xe8e8ec);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 9000);
cam.up.set(0,0,1); cam.position.set(60,-1020,300);
const ctl=new OrbitControls(cam,renderer.domElement); ctl.enableDamping=true; ctl.target.set(0,0,0);
scene.add(new THREE.AmbientLight(0xffffff,0.95));
const d1=new THREE.DirectionalLight(0xffffff,1.4); d1.position.set(150,200,400); scene.add(d1);
const d2=new THREE.DirectionalLight(0xaabbdd,0.5); d2.position.set(-200,-150,150); scene.add(d2);
scene.add(new THREE.HemisphereLight(0xddeeff,0x888888,0.5));

const loader=new GLTFLoader();
const load=p=>new Promise(res=>loader.load(p,g=>res(g.scene)));
const SPLIT='CAD Exports/Core Split/', INDV='CAD Exports/Individual Parts/GLB/';
const S=210, GAP_IN=72.05, GAP_OUT=76.05;
function paint(o,opt){ o.traverse(ch=>{ if(ch.isMesh){ ch.geometry.deleteAttribute('color'); ch.geometry.computeVertexNormals(); ch.material=new THREE.MeshStandardMaterial(opt);} }); }
function center(o){ const b=new THREE.Box3().setFromObject(o); const c=b.getCenter(new THREE.Vector3()); o.position.sub(c); }
const expParts=[]; // {obj, dz}

Promise.all([
  load(INDV+'02_Bottom_Cap.glb'),
  load(INDV+'03_Top_Cap.glb'),
  load(INDV+'04_Lid_Assembly.glb'),
  load(SPLIT+'1_Inner_Wall_Tube.glb'),
  load(SPLIT+'2_Outer_Perforated_Tube.glb'),
  load(SPLIT+'3_Support_Ring.glb'),
  load(SPLIT+'6_Ceramic_Base_Disk.glb'),
  load(INDV+'06_Ceramic_Cylinder.glb'),
]).then(([botCap,topCap,lid,inner,outer,seat,baseDisk,ceramic])=>{
  paint(botCap,{color:0xb8bec5,metalness:0.55,roughness:0.38,side:THREE.DoubleSide});
  paint(topCap,{color:0xa8c8a0,metalness:0.5,roughness:0.4,side:THREE.DoubleSide});
  paint(lid,{color:0x98b8c8,metalness:0.5,roughness:0.4,side:THREE.DoubleSide});

  const core=new THREE.Group(); core.add(inner,outer,seat,baseDisk,ceramic);
  paint(inner,{color:0xb8bec5,metalness:0.5,roughness:0.4,side:THREE.DoubleSide,transparent:true,opacity:0.30,depthWrite:false});
  paint(outer,{color:0x6f9bd8,metalness:0.4,roughness:0.4,side:THREE.DoubleSide,transparent:true,opacity:0.20,depthWrite:false});
  paint(seat,{color:0x4f8f7a,metalness:0.55,roughness:0.4,side:THREE.DoubleSide});
  paint(baseDisk,{color:0xe7d9b0,metalness:0.0,roughness:0.7,side:THREE.DoubleSide});
  paint(ceramic,{color:0xf2f0ea,metalness:0.0,roughness:0.65,side:THREE.DoubleSide});

  const outerBox=new THREE.Box3().setFromObject(outer);
  const seatBox=new THREE.Box3().setFromObject(seat);
  const zTop=outerBox.max.z, zBot=outerBox.min.z, seatZ=seatBox.getCenter(new THREE.Vector3()).z;
  const zr_top=zTop-32, zr_bot=zBot+12;
  const ringMat=new THREE.MeshStandardMaterial({color:0xd9a521,metalness:0.6,roughness:0.35,side:THREE.DoubleSide});
  const screwMat=new THREE.MeshStandardMaterial({color:0xcf9a1e,metalness:0.7,roughness:0.3});
  const flMat=new THREE.MeshStandardMaterial({color:0x4f8f7a,metalness:0.55,roughness:0.4,side:THREE.DoubleSide});
  function washer(z){ const g=new THREE.Group();
    const a=new THREE.Mesh(new THREE.RingGeometry(GAP_IN,GAP_OUT,80),ringMat); a.position.z=z;
    const b=a.clone(); b.position.z=z-3;
    const o=new THREE.Mesh(new THREE.CylinderGeometry(GAP_OUT,GAP_OUT,3,80,1,true),ringMat); o.rotation.x=Math.PI/2; o.position.z=z-1.5;
    const ii=new THREE.Mesh(new THREE.CylinderGeometry(GAP_IN,GAP_IN,3,80,1,true),ringMat); ii.rotation.x=Math.PI/2; ii.position.z=z-1.5;
    g.add(a,b,o,ii); return g; }
  function screws(z,n,rad){ n=n||8; rad=rad||73; const g=new THREE.Group();
    for(let k=0;k<n;k++){ const ang=k*(Math.PI*2/n)+Math.PI/8;
      const sh=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,16,12),screwMat); sh.rotation.z=Math.PI/2; sh.position.set(rad,0,0);
      const hd=new THREE.Mesh(new THREE.CylinderGeometry(3,3,2.5,12),screwMat); hd.rotation.z=Math.PI/2; hd.position.set(rad+8.5,0,0);
      const s=new THREE.Group(); s.add(sh,hd); s.rotation.z=ang; s.position.z=z; g.add(s);
    } return g; }
  const topW=washer(zr_top), botW=washer(zr_bot), topSc=screws(zr_top-1.5), botSc=screws(zr_bot-1.5);
  const flange=new THREE.Mesh(new THREE.CylinderGeometry(70.3,70.3,18,80,1,true),flMat); flange.rotation.x=Math.PI/2; flange.position.z=seatZ+4;
  const seatSc=screws(seatZ+4,6,70);
  core.add(topW,botW,topSc,botSc,flange,seatSc);

  // explode offsets (within the core)
  expParts.push({obj:outer,dz:200},{obj:topW,dz:120},{obj:topSc,dz:120},
    {obj:botW,dz:-70},{obj:botSc,dz:-70},{obj:seat,dz:-190},{obj:flange,dz:-190},{obj:seatSc,dz:-190},
    {obj:baseDisk,dz:-130},{obj:ceramic,dz:330});
  expParts.forEach(p=>p.baseZ=p.obj.position.z);

  const items=[botCap, core, topCap, lid];
  items.forEach((o,i)=>{ center(o); o.position.x=(i-1.5)*S; scene.add(o); });

  const el=document.getElementById('loading'); if(el) el.remove();
});

let exploded=false;
document.getElementById('exp').addEventListener('click',e=>{
  exploded=!exploded; e.target.textContent=exploded?'Put core together':'Separate core pieces';
  expParts.forEach(p=>{ p.obj.position.z = p.baseZ + (exploded?p.dz:0); });
});

addEventListener('resize',()=>{ renderer.setSize(innerWidth,innerHeight); cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); });
renderer.setSize(innerWidth,innerHeight);
(function loop(){ requestAnimationFrame(loop); ctl.update(); renderer.render(scene,cam); })();
</script>
</body>
</html>
