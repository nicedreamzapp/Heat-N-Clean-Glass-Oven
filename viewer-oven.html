THREE.Object3D.DEFAULT_UP.set(0,0,1);
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(devicePixelRatio); renderer.setClearColor(0xe8e8ec); renderer.localClippingEnabled=true;

const scene=new THREE.Scene();

const d1=new THREE.DirectionalLight(0xffffff,1.4); d1.position.set(150,-200,400); scene.add(d1);

function dimLine(a,b,text,lx,lz){ const A=new THREE.Vector3(...a), B=new THREE.Vector3(...b);

dimLine([-20,-2,-6.3],[-20,-2,-31.7],'25.4 mm open space under the base',-15,-19);
dimLine([-46.25,-2,40],[-60.85,-2,40],'14.6 mm side insulation',-146,52);
dimLine([61.65,-2,20],[64.65,-2,20],'3.0 mm tube gap (spacer rings)',78,8);
dimLine([42,-2,-0.44],[42,-2,-31.7],'31.3 mm base disk to floor',60,-40);

const $=id=>document.getElementById(id);
const stepEl=$('step'), barEl=document.querySelector('#bar i'), sl=$('sl'), btn=$('btn'), mode=$('mode'), lbtn=$('lbtn'), cutb=$('cut'), playb=$('play'), lidb=$('lidb');
const H=location.hash.slice(1).split(',');
let tab='build', cutOn=false, lidAng=H.includes('closed')?0:110;
function setClip(){ const pl=cutOn?[CLIP[tab]]:[]; items.forEach(it=>it.m.traverse(ch=>{ if(ch.isMesh) ch.material.clippingPlanes=pl; })); }
function setHot(on){ items.forEach(it=>it.m.traverse(ch=>{ if(ch.isMesh) ch.material.emissive.setHex(0); })); }

// ---------- build animation (viewer-oven-build.html) ----------
const stepIn={}; STEPS.forEach((s,i)=>s.add.forEach(f=>stepIn[f]=i));
const ease=e=>e<=0?0:e>=1?1:1-Math.pow(1-e,3);
let t=0, playing=true, lastStep=-1;
const iH=STEPS.findIndex(s=>s.lid==='hang'), iC=STEPS.findIndex(s=>s.lid==='close');
const BBOX=new THREE.Box3(); items.forEach(it=>{ const b=it.bb.clone(); if(it.p.lid) b.translate(new THREE.Vector3(0,0,LIFT)); BBOX.union(b); });
BBOX.max.z+=60; BBOX.min.z-=30; const BCT=BBOX.getCenter(new THREE.Vector3()); BCT.z-=10; let camDist=1;
const NARROW=()=>innerWidth<=700;
function fitBuild(){ const sz=BBOX.getSize(new THREE.Vector3()); const vf=Math.tan(THREE.MathUtils.degToRad(cam.fov/2));
  const w=canvas.clientWidth, h=canvas.clientHeight; let top=0, bot=0;
  if(tab==='build'&&NARROW()){ top=stepEl.offsetTop+stepEl.offsetHeight+6; bot=$('key').offsetHeight+16; }
  const hEff=Math.max(120,h-top-bot);
  camDist=Math.max(sz.z*0.5/(vf*hEff/h), Math.max(sz.x,sz.y)*0.5/(vf*cam.aspect))*1.05+Math.max(sz.x,sz.y)*0.15;
  if(top||bot) cam.setViewOffset(w,h,0,-(top-bot)/2,w,h); else cam.clearViewOffset(); }
function stepCardHeight(){ if(!NARROW()){ stepEl.style.minHeight=''; return; }   // phone: card keeps the height of its longest step, so the view never jumps
  const keep=stepEl.innerHTML; stepEl.style.minHeight=''; let mx=0;
  STEPS.forEach((s,n)=>{ stepEl.innerHTML=`<small>Step ${n+1} of ${STEPS.length} · 第 ${n+1} 步，共 ${STEPS.length} 步</small>${s.t}<br><span>${s.z}</span>`; mx=Math.max(mx,stepEl.offsetHeight); });
  stepEl.innerHTML=keep; stepEl.style.minHeight=mx+'px'; }
function buildState(t){
  const n=Math.max(0,Math.min(STEPS.length-1,Math.floor(t/DUR))), e=ease((t-n*DUR)/ANIM);
  items.forEach(it=>{ const k=stepIn[it.p.f]; const vis=k!==undefined&&k<=n; it.g.visible=vis; if(!vis) return;
    const f=(k===n)?1-e:0, how=STEPS[k].how; it.g.position.set(0,0,how==='down'?160*f:how==='up'?-120*f:0);
    if(it.kids) it.kids.forEach(kd=>kd.o.position.copy(kd.base).addScaledVector(kd.dir,how==='in'?60*f:0));
    if(!it.kids && how==='in') it.g.position.set(60*f*Math.cos(HA),60*f*Math.sin(HA),0);
    const hot=(k===n)&&t-n*DUR<DUR-0.3; it.m.traverse(ch=>{ if(ch.isMesh) ch.material.emissive.setHex(hot?0x332200:0x000000); }); });
  let lz=LIFT, ang=0;
  if(n>=iH){ const eh=n===iH?e:1; lz=LIFT*(1-eh); ang=OPEN*eh; }
  if(n>=iC){ const ec=n===iC?e:1; lz=0; ang=OPEN*(1-ec); }
  lidOuter.position.set(0,0,lz); lidPivot.quaternion.setFromAxisAngle(HAX,ang*Math.PI/180);
  if(n!==lastStep){ lastStep=n; stepEl.innerHTML=`<small>Step ${n+1} of ${STEPS.length} · 第 ${n+1} 步，共 ${STEPS.length} 步</small>${STEPS[n].t}<br><span style="color:#444">${STEPS[n].z}</span>`; }
  barEl.style.width=(100*Math.min(1,t/TOTAL))+'%';
  if(!userCam){ const a=-2.08+0.45*Math.min(1,t/TOTAL), el=0.36, r=camDist;   // slow quarter turn while it builds
    cam.position.set(BCT.x+r*Math.cos(a)*Math.cos(el),BCT.y+r*Math.sin(a)*Math.cos(el),BCT.z+r*Math.sin(el)); ctl.target.copy(BCT); } }
function setPlaying(p){ playing=p; playb.textContent=playing?'❚❚ Pause':'▶ Play'; }
playb.onclick=()=>{ if(!playing&&t>=TOTAL) t=0; setPlaying(!playing); };
$('next').onclick=()=>{ t=Math.min(STEPS.length-1,Math.floor(t/DUR)+1)*DUR; };
$('prev').onclick=()=>{ t=Math.max(0,Math.floor(t/DUR)-1)*DUR; };
$('again').onclick=()=>{ t=0; userCam=false; setPlaying(true); };

// ---------- whole / base / lid (viewer-complete.html, viewer-base-full.html, viewer-lid-full.html) ----------
function cur(){ return VIEWS[tab]; }
function labelsOn(v,f){ return v.showL&&(v.name==='whole'?(!cutOn&&f>0.5):true); }
function apply(v,f){
  if(v.name==='whole'){ lidOuter.position.set(0,0,0); lidPivot.quaternion.setFromAxisAngle(HAX, lidAng*(1-f)*Math.PI/180); }   // separated: lid swings upright
  else { lidOuter.position.set(0,0,0); lidPivot.quaternion.identity(); }
  v.w.forEach(w=>{ w.g.position.set(0,0,w.dz*f); if(w.kids) w.kids.forEach(kd=>kd.o.position.copy(kd.base).addScaledVector(kd.dir,RADIAL*f)); });
  mode.textContent=f<0.02?'assembled':(f>0.98?'separated':'…'); v.LB.setVisible(labelsOn(v,f));
  dimG.visible=v.name==='base'&&cutOn&&f<0.05; }
function frame(v,f,_n=0){ const box=new THREE.Box3(); scene.updateMatrixWorld(true);
  v.w.forEach(w=>box.expandByObject(w.m));
  const LB=v.LB; if(labelsOn(v,f)&&f>0.5){ const lw=(LB.wMax||LB.maxW)*1.05; box.max.x=Math.max(box.max.x,LB.R0+lw); box.min.x=Math.min(box.min.x,-(LB.R0+lw)); if(LB.zTop!==null){ box.max.z=Math.max(box.max.z,LB.zTop); box.min.z=Math.min(box.min.z,LB.zBot); } const hz=box.max.z-box.min.z; box.max.z+=0.07*hz; box.min.z-=0.03*hz; }
  const ctr=box.getCenter(new THREE.Vector3()); const dir=cam.position.clone().sub(ctl.target).normalize();
  const up=new THREE.Vector3(0,0,1), right=new THREE.Vector3().crossVectors(up,dir).normalize(), cup=new THREE.Vector3().crossVectors(dir,right).normalize();
  const tv=Math.tan(THREE.MathUtils.degToRad(cam.fov/2)), th=tv*cam.aspect; let d=0;
  for(const cx of [box.min.x,box.max.x]) for(const cy of [box.min.y,box.max.y]) for(const cz of [box.min.z,box.max.z]){
    const p=new THREE.Vector3(cx,cy,cz).sub(ctr); const depth=p.dot(dir);
    d=Math.max(d, Math.abs(p.dot(right))/th+depth, Math.abs(p.dot(cup))/tv+depth); }
  ctl.target.copy(ctr); cam.position.copy(ctr).add(dir.multiplyScalar(d*1.05)); ctl.update();
  if(labelsOn(v,f)&&f>0.5&&_n<1){ LB.update(cam.position.distanceTo(ctl.target)/900,f); frame(v,f,_n+1); } }
function syncBtns(v){ sl.value=v.k; btn.textContent=v.goal>0.5?'Assemble':'Separate';
  lbtn.textContent=v.showL?'Hide labels':'Show labels'; lidb.textContent=lidAng?'Close lid':'Open lid';
  cutb.textContent=(cutOn?'✓ ':'')+(tab==='base'?'Cut in half + measurements':'Cut in half'); cutb.classList.toggle('on',cutOn); }
sl.oninput=()=>{ const v=cur(); v.goal=v.k=parseFloat(sl.value); apply(v,v.k); syncBtns(v); };
sl.onchange=()=>frame(cur(),cur().k);
btn.onclick=()=>{ const v=cur(); v.goal=v.goal>0.5?0:1; syncBtns(v); };
lbtn.onclick=()=>{ const v=cur(); v.showL=!v.showL;
  if(v.showL&&v.name==='whole'){ if(cutOn){ cutOn=false; setClip(); } if(v.goal<0.5) v.goal=1; }   // labels need the parts apart + no cut: do it for him
  apply(v,v.k); frame(v,v.k); syncBtns(v); };
lidb.onclick=()=>{ lidAng=lidAng?0:110; const v=cur(); apply(v,v.k); frame(v,v.k); syncBtns(v); };
$('fbtn').onclick=()=>{ if(tab==='build'){ userCam=false; return; } const v=cur(); frame(v,v.k); };

// ---------- cut in half: one switch, every tab, live ----------
cutb.onclick=()=>{ cutOn=!cutOn; setClip();
  if(tab!=='build'){ const v=cur(); v.showL=!cutOn||v.k>0.5; apply(v,v.k); frame(v,v.k); syncBtns(v); }   // labels pile up in the section view
  else syncBtns(VIEWS.whole); };

// ---------- tabs ----------
const TITLES={build:'THE OVEN BUILDS ITSELF · 整机自动组装',whole:VIEWS.whole.title,base:VIEWS.base.title,lid:VIEWS.lid.title};
function setTab(name){ tab=name;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===name));
  document.querySelectorAll('#ctl [data-tabs]').forEach(el=>el.classList.toggle('show',el.dataset.tabs.split(' ').includes(name)));
  $('title').textContent=TITLES[name];
  stepEl.classList.toggle('hide',name!=='build'); $('bar').classList.toggle('hide',name!=='build');
  Object.values(VIEWS).forEach(v=>v.LB.setVisible(false)); dimG.visible=false; setHot(false); setClip();
  if(name==='build'){ lastStep=-1; userCam=false; stepCardHeight(); fitBuild(); buildState(t); syncBtns(VIEWS.whole); return; }
  cam.clearViewOffset();
  const v=VIEWS[name], inV=new Set(v.w.map(w=>w.f)); items.forEach(it=>{ it.g.visible=inV.has(it.p.f); it.g.position.set(0,0,0);
    if(it.kids) it.kids.forEach(kd=>kd.o.position.copy(kd.base)); });
  if(cutOn) v.showL=v.k>0.5;
  cam.position.set(-500,-900,420); ctl.target.set(0,0,0); apply(v,v.k); frame(v,v.k); syncBtns(v); }
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{ if(b.dataset.t!==tab) setTab(b.dataset.t); });

function fit(){ const w=canvas.clientWidth,h=canvas.clientHeight; if(!w||!h) return; renderer.setSize(w,h,false); cam.aspect=w/h;
  if(tab==='build'){ stepCardHeight(); fitBuild(); } cam.updateProjectionMatrix();
  if(tab!=='build'){ const v=cur(); frame(v,v.k); } }
new ResizeObserver(fit).observe($('stage'));
$('loading').remove();
// hash: #whole,separated,cut etc.
if(H.includes('separated')) Object.values(VIEWS).forEach(v=>v.k=v.goal=1);
if(H.includes('assembled')) Object.values(VIEWS).forEach(v=>v.k=v.goal=0);
fit(); setTab(['build','whole','base','lid'].find(n=>H.includes(n))||'build');
if(H.includes('cut')) cutb.onclick();
if(H.includes('paused')) setPlaying(false);
window.__oven={setTab,get t(){return t;},set t(v){t=v;},setPlaying,get cut(){return cutOn;},TOTAL};
let tPrev=performance.now();
(function loop(){ requestAnimationFrame(loop); const now=performance.now(), dt=Math.min(0.1,(now-tPrev)/1000); tPrev=now;
  if(tab==='build'){ if(playing){ t=Math.min(TOTAL,t+dt); if(t>=TOTAL) setPlaying(false); } buildState(t); }
  else { const v=cur(); if(Math.abs(v.goal-v.k)>0.001){ v.k+=(v.goal-v.k)*0.08; if(Math.abs(v.goal-v.k)<=0.001) v.k=v.goal; sl.value=v.k; apply(v,v.k); frame(v,v.k); }
    const ls=cam.position.distanceTo(ctl.target)/900; v.LB.update(ls,v.k);
    dimG.children.forEach(o=>{ if(o.isSprite) o.scale.set(o.userData.w*ls*1.6,o.userData.h*ls*1.6,1); }); }
  ctl.update(); renderer.render(scene,cam); })();
</script>
</body></html>
