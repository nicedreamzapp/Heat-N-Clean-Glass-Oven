<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heat-N-Clean Glass Oven — Metal Parts Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #eee; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
  #canvas-container { width: 100vw; height: 100vh; }
  canvas { display: block; }

  #controls {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    background: rgba(20, 20, 40, 0.92); border: 1px solid #333;
    border-radius: 10px; padding: 16px; min-width: 260px;
    backdrop-filter: blur(12px);
  }
  #controls h2 { font-size: 14px; margin-bottom: 12px; color: #aaa; letter-spacing: 1px; text-transform: uppercase; }
  #part-select {
    width: 100%; padding: 8px 10px; font-size: 14px;
    background: #222; color: #eee; border: 1px solid #444;
    border-radius: 6px; cursor: pointer; outline: none;
  }
  #part-select:focus { border-color: #5588ff; }
  #part-select option { background: #222; color: #eee; }

  #status {
    margin-top: 10px; font-size: 12px; color: #888;
  }
  #status.loading { color: #ffaa44; }
  #status.ready { color: #44cc66; }
  #status.error { color: #ff4466; }

  .btn-row { display: flex; gap: 6px; margin-top: 10px; }
  .btn {
    flex: 1; padding: 6px 0; font-size: 12px; text-align: center;
    background: #2a2a44; border: 1px solid #444; border-radius: 5px;
    color: #ccc; cursor: pointer; transition: background 0.15s;
  }
  .btn:hover { background: #3a3a5a; color: #fff; }

  #info {
    position: fixed; bottom: 16px; left: 16px; z-index: 10;
    font-size: 11px; color: #666;
  }
</style>
</head>
<body>

<div id="controls">
  <h2>Metal Parts Viewer</h2>
  <select id="part-select">
    <optgroup label="Individual Parts">
      <option value="CAD Exports/Individual Parts/GLB/01_Base_Body.glb">01 — Base Body (Housing)</option>
      <option value="CAD Exports/Individual Parts/GLB/02_Bottom_Cap.glb">02 — Bottom Cap</option>
      <option value="CAD Exports/Individual Parts/GLB/03_Top_Cap.glb">03 — Top Cap</option>
      <option value="CAD Exports/Individual Parts/GLB/04_Lid_Assembly.glb">04 — Lid Assembly</option>
      <option value="CAD Exports/Individual Parts/GLB/05_Hinge_Pin.glb">05 — Hinge Pin</option>
      <option value="CAD Exports/Individual Parts/GLB/12_Steel_Tray.glb">12 — Steel Tray</option>
      <option value="CAD Exports/Individual Parts/GLB/13_Wiring_Conduit.glb">13 — Wiring Conduit</option>
    </optgroup>
    <optgroup label="Assembly Views">
      <option value="CAD Exports/Individual Parts/GLB/4_Metal_Parts.glb">4 Metal Parts (Side-by-Side)</option>
      <option value="CAD Exports/Individual Parts/GLB/00_Complete_Assembly.glb" selected>Complete Assembly</option>
    </optgroup>
  </select>
  <div class="btn-row">
    <div class="btn" id="btn-reset">Reset View</div>
    <div class="btn" id="btn-wire">Wireframe</div>
    <div class="btn" id="btn-grid">Grid</div>
  </div>
  <div id="status" class="loading">Loading...</div>
</div>

<div id="info">Orbit: Left-click drag &nbsp;|&nbsp; Zoom: Scroll &nbsp;|&nbsp; Pan: Right-click drag</div>

<div id="canvas-container"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const container = document.getElementById('canvas-container');
const statusEl = document.getElementById('status');
const selectEl = document.getElementById('part-select');

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

// Camera
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 5000);
camera.position.set(200, 150, 250);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 10;
controls.maxDistance = 2000;

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight1.position.set(150, 200, 100);
dirLight1.castShadow = false;
scene.add(dirLight1);

const dirLight2 = new THREE.DirectionalLight(0x8888ff, 0.4);
dirLight2.position.set(-100, 100, -150);
scene.add(dirLight2);

const hemiLight = new THREE.HemisphereLight(0xccddff, 0x333344, 0.6);
scene.add(hemiLight);

// Grid
const gridHelper = new THREE.GridHelper(400, 40, 0x333355, 0x222244);
scene.add(gridHelper);

// Axes
const axesHelper = new THREE.AxesHelper(60);
scene.add(axesHelper);

// State
let currentModel = null;
let wireframeMode = false;

const loader = new GLTFLoader();

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls;
}

function clearModel() {
  if (currentModel) {
    scene.remove(currentModel);
    currentModel.traverse(child => {
      if (child.isMesh) {
        child.geometry.dispose();
        if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
        else if (child.material) child.material.dispose();
      }
    });
    currentModel = null;
  }
}

function fitCameraToModel(object) {
  const box = new THREE.Box3().setFromObject(object);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const dist = maxDim * 1.8;

  controls.target.copy(center);
  camera.position.set(center.x + dist * 0.6, center.y + dist * 0.5, center.z + dist * 0.7);
  camera.lookAt(center);
  controls.update();
}

function applyMetalMaterial(object) {
  object.traverse(child => {
    if (child.isMesh) {
      // If no material color set or it's default white, give it a brushed steel look
      if (!child.material.map) {
        child.material.metalness = 0.85;
        child.material.roughness = 0.35;
        if (child.material.color.getHex() === 0xffffff || child.material.color.getHex() === 0xcccccc) {
          child.material.color.setHex(0xb8bcc0);
        }
      }
      child.material.wireframe = wireframeMode;
      child.material.side = THREE.DoubleSide;
    }
  });
}

function loadPart(url) {
  clearModel();
  setStatus('Loading...', 'loading');

  loader.load(
    url,
    (gltf) => {
      currentModel = gltf.scene;
      applyMetalMaterial(currentModel);
      scene.add(currentModel);
      fitCameraToModel(currentModel);
      const partName = selectEl.options[selectEl.selectedIndex].text;
      setStatus(`${partName} — loaded`, 'ready');
    },
    (progress) => {
      if (progress.total > 0) {
        const pct = Math.round((progress.loaded / progress.total) * 100);
        setStatus(`Loading... ${pct}%`, 'loading');
      }
    },
    (error) => {
      console.error(error);
      setStatus('Error loading model', 'error');
    }
  );
}

// Events
selectEl.addEventListener('change', () => loadPart(selectEl.value));

document.getElementById('btn-reset').addEventListener('click', () => {
  if (currentModel) fitCameraToModel(currentModel);
});

document.getElementById('btn-wire').addEventListener('click', () => {
  wireframeMode = !wireframeMode;
  document.getElementById('btn-wire').style.background = wireframeMode ? '#445588' : '';
  if (currentModel) {
    currentModel.traverse(child => {
      if (child.isMesh) child.material.wireframe = wireframeMode;
    });
  }
});

document.getElementById('btn-grid').addEventListener('click', () => {
  gridHelper.visible = !gridHelper.visible;
  axesHelper.visible = !axesHelper.visible;
  document.getElementById('btn-grid').style.background = gridHelper.visible ? '' : '#445588';
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Render loop
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// Load default part
loadPart(selectEl.value);
</script>

</body>
</html>
