<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heat &amp; Clean Glass Oven: it builds itself (2026-11-08 R2)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e8e8ec;font-family:-apple-system,"PingFang SC",sans-serif;color:#16181d;overflow:hidden}
#wrap{position:fixed;inset:0} canvas{display:block;width:100%;height:100%}
#loading{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:18px;color:#666;z-index:20}
#ctl{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.92);padding:10px 14px;border-radius:10px;display:flex;gap:10px;align-items:center;font-size:14px;z-index:10;flex-wrap:wrap;max-width:calc(100vw - 24px)}
#ctl b{font-size:16px} #ctl button{font-size:15px;padding:6px 14px;border-radius:8px;border:1px solid #999;background:#fff;cursor:pointer}
#bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.08);z-index:10} #bar i{display:block;height:100%;width:0;background:#1f5fb3}
#step{position:absolute;top:70px;left:12px;max-width:min(760px,calc(100vw - 24px));background:#fff;border-left:5px solid #d08a00;padding:12px 16px;border-radius:8px;font-size:18px;line-height:1.4;z-index:10;box-shadow:0 4px 18px rgba(0,0,0,.12)}
#step small{display:block;color:#666;font-size:13px;margin-bottom:3px}
#key{position:absolute;bottom:14px;left:12px;background:rgba(255,255,255,.9);padding:8px 12px;border-radius:10px;font-size:13px;z-index:10;display:flex;gap:14px;flex-wrap:wrap;max-width:calc(100vw - 24px)}
#key i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
body.rec #ctl button, body.rec #bar{display:none}
</style></head><body>
<div id="wrap">
<div id="loading">Loading…</div>
<div id="ctl"><b>THE OVEN BUILDS ITSELF · 整机自动组装 (2026-11-08 R2)</b><button id="play">❚❚ Pause</button><button id="prev">◀ Back</button><button id="next">Next ▶</button><button id="again">↻ Replay</button></div>
<div id="step"></div>
<div id="key"><span><i style="background:#2f6fd6"></i>bottom cap</span><span><i style="background:#2fa84f"></i>support ring / lid holder</span><span><i style="background:#fff;border:1px solid #bbb"></i>ceramic disks</span><span><i style="background:#9b59b6"></i>top cap / lid top</span><span><i style="background:#a9b4c2"></i>outer tube</span><span><i style="background:#d9825a"></i>inner tube</span><span><i style="background:#efe9da;border:1px solid #bbb"></i>ceramic</span><span><i style="background:#4a4f56"></i>bolts + nuts</span></div>
<div id="bar"><i></i></div>
<canvas id="c"></canvas>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
// The whole oven builds itself from the 2026-11-08-R2 package meshes (viewer-full/, viewer-lid-full/): the base, then the
// lid above it, then the lid drops onto its hinge and closes. Everything is a pure function of time t, so the page
// plays live and the MP4 (Renders/oven_builds_itself_2026-11-08-R2.mp4) is recorded frame by frame from the same code (?record).
const PARTS=[
  {f:'04',col:'cap'},{f:'01',col:'in'},{f:'spacer_bot',col:'cer'},{f:'02',col:'out'},{f:'bolts_bot',col:'bolt',radial:true},
  {f:'03',col:'sup'},{f:'spacer_seat',col:'cer'},{f:'bolts_seat',col:'bolt',radial:true},{f:'spacer_top',col:'cer'},
  {f:'basedisk',col:'disk'},{f:'core',col:'cer'},{f:'cap',col:'top'},{f:'bolts_top',col:'bolt',radial:true},
  {f:'feet',col:'cer'},{f:'legscrews',col:'bolt'},
  {f:'09',col:'sup',lid:true},{f:'06',col:'in',lid:true},{f:'spacer_low',col:'cer',lid:true},{f:'07',col:'out',lid:true},
  {f:'bolts_low',col:'bolt',lid:true,radial:true},{f:'spacer_high',col:'cer',lid:true},{f:'08',col:'top',lid:true},
  {f:'bolts_high',col:'bolt',lid:true,radial:true},{f:'10',col:'bolt',lid:true},{f:'liddisk',col:'disk',lid:true},
  {f:'11',col:'out',lid:true},{f:'13',col:'bolt',lid:true},
];
// how: 'down' lowered in, 'up' from below, 'in' bolts pushed in from outside; lid:'hang' / 'close' move the whole lid
const STEPS=[
 {add:['04'],how:'down',t:'1. Bottom Cap 04 on the bench, rim up (Ø149.5).',z:'底盖 04 放在台面上，边朝上（Ø149.5）。'},
 {add:['01'],how:'down',t:'2. Inner Wall Tube 01 stands inside the cap (ID 133.7).',z:'内壁管 01 立在底盖里（内径 133.7）。'},
 {add:['spacer_bot'],how:'down',t:'3. Bottom ceramic spacer slides down over the inner tube; holes lined up.',z:'底部陶瓷垫环套在内管外，孔对齐。'},
 {add:['02'],how:'down',t:'4. Outer Perforated Tube 02 slides down over everything (OD 146.5).',z:'外冲孔管 02 套在外面（外径 146.5）。'},
 {add:['bolts_bot'],how:'in',t:'5. 6 bottom M6 bolts: cap rim, outer tube, spacer, inner tube. Nuts inside.',z:'底部 6 颗 M6 螺栓穿过底盖边、外管、垫环、内管，螺母在里面。'},
 {add:['03'],how:'down',t:'6. Insulation pad in the bottom, then Support Ring 03 drops in to the seat holes.',z:'底部放保温棉，再放支撑环 03 到座圈孔位置。'},
 {add:['spacer_seat'],how:'down',t:'7. Seat ceramic spacer into the 4.4 mm gap between the tubes.',z:'座圈陶瓷垫环放进两管之间 4.4 mm 的空隙。'},
 {add:['bolts_seat'],how:'in',t:'8. 6 seat bolts through outer tube, spacer, inner tube and the 03 wall.',z:'6 颗座圈螺栓穿过外管、垫环、内管和 03 的墙。'},
 {add:['spacer_top'],how:'down',t:'9. Top ceramic spacer into the gap at the top holes.',z:'顶部陶瓷垫环放进空隙，对准上排孔。'},
 {add:['basedisk'],how:'down',t:'10. Ceramic base disk onto the raised seat of 03.',z:'陶瓷底盘放在 03 抬高的座面上。'},
 {add:['core'],how:'down',t:'11. Ceramic heater core onto the base disk, glass slots lined up. Wire it, pack the 20.6 mm side insulation.',z:'陶瓷加热芯放在底盘上，玻璃槽对齐。接线，塞入 20.6 mm 侧面保温棉。'},
 {add:['cap'],how:'down',t:'12. One-piece Top Cap 05: tabs down the outside, grooves into the glass slots. Ring is now 28.4 mm wide.',z:'一体顶盖 05：折边片沿外侧向下，金属槽落进玻璃槽。圆环宽 28.4 mm。'},
 {add:['bolts_top'],how:'in',t:'13. 6 top bolts through the cap tabs, outer tube, spacer, inner tube.',z:'6 颗顶部螺栓穿过顶盖折边片、外管、垫环、内管。'},
 {add:['feet','legscrews'],how:'up',t:'14. 3 ceramic feet screwed on underneath. The base is done.',z:'底部拧上 3 个陶瓷脚。底座完成。'},
 {add:['09'],how:'down',t:'15. Lid: Ceramic Holder 09 first. Its 48 vent holes line up with the top cap vents.',z:'盖子：先放陶瓷托架 09，48 个通风孔对准顶盖通风孔。'},
 {add:['06'],how:'down',t:'16. Lid Inner Tube 06 over the holder wall.',z:'盖子内管 06 套在托架立墙外。'},
 {add:['spacer_low'],how:'down',t:'17. Lower lid ceramic spacer.',z:'盖子下排陶瓷垫环。'},
 {add:['07'],how:'down',t:'18. Lid Outer Perforated Tube 07.',z:'盖子外冲孔管 07。'},
 {add:['bolts_low'],how:'in',t:'19. 6 lower lid bolts through 07, spacer, 06 and the 09 wall.',z:'6 颗盖子下排螺栓穿过 07、垫环、06 和 09 的立墙。'},
 {add:['spacer_high'],how:'down',t:'20. Upper lid ceramic spacer.',z:'盖子上排陶瓷垫环。'},
 {add:['08'],how:'down',t:'21. Lid Top Disk 08, skirt down the outside.',z:'盖子顶盘 08，裙边沿外侧向下。'},
 {add:['bolts_high'],how:'in',t:'22. 6 upper lid bolts through the 08 skirt, 07, spacer and 06.',z:'6 颗盖子上排螺栓穿过 08 裙边、07、垫环和 06。'},
 {add:['10'],how:'down',t:'23. Handle 10: two M4 screws come up from inside the lid into its posts.',z:'提手 10：两颗 M4 螺丝从盖子里面往上拧进提手脚。'},
 {add:['liddisk'],how:'up',t:'24. Fill the lid with insulation, glue the ceramic lid disk into the 09 pocket.',z:'盖子里塞满保温棉，把陶瓷盖盘粘进 09 的槽位。'},
 {add:['11','13'],how:'in',t:'25. Hinge strap 11 and pin 13 on the lid bolt at 292.4° (placeholder: Tianrun fits their stock hinge).',z:'铰链片 11 和销 13 装在 292.4° 的盖子螺栓上（示意：天润用自己的合页）。'},
 {add:[],lid:'hang',t:'26. The lid goes onto the hinge.',z:'盖子装到铰链上。'},
 {add:[],lid:'close',t:'27. Close the lid. Done: the 2026-11-08 R2 oven, Ø149.5 over the caps; the ceramic top is flush with the top cap.',z:'合上盖子。完成：2026-11-08 R2 版炉子，总外径 Ø149.5；陶瓷顶面和顶盖齐平。'},
];
const DUR=3.6, ANIM=1.5, LIFT=150, OPEN=110, TOTAL=STEPS.length*DUR+2.5;
const COL={out:0xa9b4c2,in:0xd9825a,cer:0xefe9da,bolt:0x2d3136,cap:0x2f6fd6,sup:0x2fa84f,disk:0xffffff,top:0x9b59b6};
const REC=new URLSearchParams(location.search).has('record'); if(REC) document.body.classList.add('rec');
const V='?v='+Date.now();
THREE.Object3D.DEFAULT_UP.set(0,0,1);
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(REC&&!new URLSearchParams(location.search).has('hires')?1:devicePixelRatio); renderer.setClearColor(0xe8e8ec);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.13;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(32,1,0.1,20000); cam.up.set(0,0,1);
const ctl=new OrbitControls(cam,renderer.domElement); ctl.enableDamping=!REC;
let userCam=false; renderer.domElement.addEventListener('pointerdown',()=>userCam=true); renderer.domElement.addEventListener('wheel',()=>userCam=true);
scene.add(new THREE.AmbientLight(0xffffff,0.95));
const d1=new THREE.DirectionalLight(0xffffff,1.4); d1.position.set(150,-200,400); scene.add(d1);
const d2=new THREE.DirectionalLight(0xaabbdd,0.5); d2.position.set(-200,-150,150); scene.add(d2);
scene.add(new THREE.HemisphereLight(0xddeeff,0x888888,0.5));
// lid hinge, same numbers as viewer-complete.html: axis tangent at 292.4°, pivot r 77.5, z 100.86 (98.2 before R2)
const HA=292.4*Math.PI/180, HC=new THREE.Vector3(77.5*Math.cos(HA),77.5*Math.sin(HA),100.86), HAX=new THREE.Vector3(-Math.sin(HA),Math.cos(HA),0);
const lidOuter=new THREE.Group(); scene.add(lidOuter); const lidPivot=new THREE.Group(); lidPivot.position.copy(HC); lidOuter.add(lidPivot);
const lidInner=new THREE.Group(); lidInner.position.copy(HC).negate(); lidPivot.add(lidInner);
const loader=new GLTFLoader(); const load=p=>new Promise((res,rej)=>loader.load(p,g=>res(g.scene),undefined,rej));
function paint(o,color){ o.traverse(ch=>{ if(ch.isMesh){ ch.geometry.deleteAttribute('color'); ch.geometry.computeVertexNormals();
  const cer=(color===COL.cer||color===COL.disk);
  ch.material=new THREE.MeshStandardMaterial({color,side:THREE.DoubleSide,metalness:cer?0.05:0.45,roughness:cer?0.8:0.45}); } }); }
const models=await Promise.all(PARTS.map(p=>load((p.lid?'viewer-lid-full/':'viewer-full/')+p.f+'.glb'+V).catch(()=>null)));
const items=[], byF={};
PARTS.forEach((p,i)=>{ const m=models[i]; if(!m) return; paint(m,COL[p.col]); m.updateMatrixWorld(true);
  const it={p,m}; it.bb=new THREE.Box3().setFromObject(m);
  if(p.radial){ it.kids=[]; m.traverse(ch=>{ if(ch.isMesh){ const b=new THREE.Box3().setFromObject(ch), cc=b.getCenter(new THREE.Vector3());
    it.kids.push({o:ch,dir:new THREE.Vector3(cc.x,cc.y,0).normalize(),base:ch.position.clone()}); } }); }
  it.g=new THREE.Group(); it.g.add(m); (p.lid?lidInner:scene).add(it.g); items.push(it); byF[p.f]=it; });
const stepIn={}; STEPS.forEach((s,i)=>s.add.forEach(f=>stepIn[f]=i));
const ease=e=>e<=0?0:e>=1?1:1-Math.pow(1-e,3);
const stepEl=document.getElementById('step'), barEl=document.querySelector('#bar i');
let lastStep=-1;
function state(t){
  const n=Math.max(0,Math.min(STEPS.length-1,Math.floor(t/DUR))), e=ease((t-n*DUR)/ANIM);
  items.forEach(it=>{ const k=stepIn[it.p.f]; const vis=k!==undefined&&k<=n; it.g.visible=vis; if(!vis) return;
    const f=(k===n)?1-e:0, how=STEPS[k].how; it.g.position.set(0,0,how==='down'?160*f:how==='up'?-120*f:0);
    if(it.kids) it.kids.forEach(kd=>kd.o.position.copy(kd.base).addScaledVector(kd.dir,how==='in'?60*f:0));
    if(!it.kids && how==='in') it.g.position.set(60*f*Math.cos(HA),60*f*Math.sin(HA),0);   // hinge parts come in from outside
    const hot=(k===n)&&t-n*DUR<DUR-0.3; it.m.traverse(ch=>{ if(ch.isMesh) ch.material.emissive.setHex(hot?0x332200:0x000000); }); });
  const iH=STEPS.findIndex(s=>s.lid==='hang'), iC=STEPS.findIndex(s=>s.lid==='close');
  let lz=LIFT, ang=0;
  if(n>iH||(n===iH)){ const eh=n===iH?e:1; lz=LIFT*(1-eh); ang=OPEN*eh; }
  if(n>iC||(n===iC)){ const ec=n===iC?e:1; lz=0; ang=OPEN*(1-ec); }
  lidOuter.position.set(0,0,lz); lidPivot.quaternion.setFromAxisAngle(HAX,ang*Math.PI/180);
  if(n!==lastStep){ lastStep=n; stepEl.innerHTML=`<small>Step ${n+1} of ${STEPS.length} · 第 ${n+1} 步，共 ${STEPS.length} 步</small>${STEPS[n].t}<br><span style="color:#444">${STEPS[n].z}</span>`; }
  barEl.style.width=(100*Math.min(1,t/TOTAL))+'%';
  if(!userCam){ const a=-2.08+0.45*Math.min(1,t/TOTAL), el=0.36;   // slow quarter turn while it builds
    const r=camDist; cam.position.set(CT.x+r*Math.cos(a)*Math.cos(el),CT.y+r*Math.sin(a)*Math.cos(el),CT.z+r*Math.sin(el)); ctl.target.copy(CT); }
}
// frame: the base, the lid lifted above it and the parts coming in from above
const BOX=new THREE.Box3(); items.forEach(it=>{ const b=it.bb.clone(); if(it.p.lid) b.translate(new THREE.Vector3(0,0,LIFT)); BOX.union(b); });
BOX.max.z+=60; BOX.min.z-=30; const CT=BOX.getCenter(new THREE.Vector3()); CT.z-=10; let camDist=1;
function fit(){ const w=canvas.clientWidth,h=canvas.clientHeight; renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix();
  const sz=BOX.getSize(new THREE.Vector3()); const vf=Math.tan(THREE.MathUtils.degToRad(cam.fov/2));
  camDist=Math.max(sz.z*0.5/vf, Math.max(sz.x,sz.y)*0.5/(vf*cam.aspect))*1.08+Math.max(sz.x,sz.y)*0.35; }
addEventListener('resize',fit); fit();
document.getElementById('loading').remove();
let t=0, playing=!REC, tPrev=performance.now();
const playb=document.getElementById('play');
playb.onclick=()=>{ playing=!playing; playb.textContent=playing?'❚❚ Pause':'▶ Play'; };
document.getElementById('next').onclick=()=>{ t=Math.min(STEPS.length-1,Math.floor(t/DUR)+1)*DUR; };
document.getElementById('prev').onclick=()=>{ t=Math.max(0,Math.floor(t/DUR)-1)*DUR; };
document.getElementById('again').onclick=()=>{ t=0; userCam=false; playing=true; playb.textContent='❚❚ Pause'; };
window.__total=TOTAL; window.__frame=tt=>{ state(tt); ctl.update(); renderer.render(scene,cam); return true; };
state(0); window.__ready=true;
if(!REC) (function loop(){ requestAnimationFrame(loop); const now=performance.now(); if(playing) t=Math.min(TOTAL,t+(now-tPrev)/1000); tPrev=now;
  state(t); ctl.update(); renderer.render(scene,cam); })();
</script>
</body></html>
