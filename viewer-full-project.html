<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Heat & Clean — Full Project</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #e8e8ec; overflow: hidden; font-family: -apple-system, sans-serif; }
canvas { width: 100vw; height: 100vh; display: block; }
#label { position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  background: rgba(20,20,30,0.85); color: #fff; padding: 10px 24px; border-radius: 10px;
  font-size: 16px; font-weight: 600; z-index: 10; }
#info { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(20,20,30,0.7); color: #ddd; padding: 8px 18px; border-radius: 8px;
  font-size: 12px; z-index: 10; }
#loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  font-size: 18px; color: #444; z-index: 20;
  background: rgba(255,255,255,0.8); padding: 16px 32px; border-radius: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="label">Heat &amp; Clean Glass Oven — Full Assembly (Lid Open)</div>
<div id="info">Drag: rotate &bull; Scroll: zoom &bull; Right-drag: pan</div>
<div id="loading">Loading full assembly...</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

THREE.Object3D.DEFAULT_UP.set(0, 0, 1);

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0xe8e8ec);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 5000);
camera.up.set(0, 0, 1);
camera.position.set(380, -380, 220);

const ctl = new OrbitControls(camera, renderer.domElement);
ctl.enableDamping = true;
ctl.target.set(0, 0, 40);

// Strong lighting so nothing looks dark
scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const d1 = new THREE.DirectionalLight(0xffffff, 1.0);
d1.position.set(300, 300, 500);
scene.add(d1);
const d2 = new THREE.DirectionalLight(0xffffff, 0.6);
d2.position.set(-300, -200, 200);
scene.add(d2);
const d3 = new THREE.DirectionalLight(0xffffff, 0.4);
d3.position.set(0, -500, -100);
scene.add(d3);
scene.add(new THREE.HemisphereLight(0xe8ecff, 0x888888, 0.5));

const grid = new THREE.GridHelper(800, 40, 0xbbbbcc, 0xd0d0d8);
grid.rotation.x = Math.PI / 2;
grid.position.z = -80;
scene.add(grid);

const loader = new GLTFLoader();
loader.load(
  'CAD Exports/Assembly_LidOpen.glb',
  gltf => {
    gltf.scene.traverse(ch => {
      if (ch.isMesh) {
        // Keep the baked vertex colors from the trimesh export —
        // those have the real per-part colors (stainless, ceramic,
        // kanthal orange, etc). Use Lambert (matte) shading so
        // the colors show up without metalness blowing them out.
        const hasColors = !!ch.geometry.attributes.color;
        ch.geometry.computeVertexNormals();
        ch.material = new THREE.MeshLambertMaterial({
          vertexColors: hasColors,
          color: hasColors ? 0xffffff : 0xc0c5cb,
          side: THREE.DoubleSide,
        });
      }
    });
    scene.add(gltf.scene);

    // Auto-center the camera on the assembly bounds
    const box = new THREE.Box3().setFromObject(gltf.scene);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    camera.position.set(
      center.x + maxDim * 1.3,
      center.y - maxDim * 1.3,
      center.z + maxDim * 0.7
    );
    ctl.target.copy(center);
    ctl.update();
    grid.position.z = box.min.z - 5;

    document.getElementById('loading').remove();
  },
  p => {
    const pct = p.total ? Math.round(p.loaded / p.total * 100) : 0;
    document.getElementById('loading').textContent = `Loading... ${pct}%`;
  },
  e => { console.error(e); document.getElementById('loading').textContent = 'Error'; }
);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
(function a(){ requestAnimationFrame(a); ctl.update(); renderer.render(scene,camera); })();
</script>
</body>
</html>
