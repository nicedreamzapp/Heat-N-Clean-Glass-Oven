<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heat-N-Clean — 4 Main Metal Parts</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f0f0f0; color: #333; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; position: fixed; top: 0; left: 0; z-index: 0; }

  #panel {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    background: rgba(255,255,255,0.92); border: 1px solid #ccc;
    border-radius: 10px; padding: 16px 18px; min-width: 240px;
    backdrop-filter: blur(12px); box-shadow: 0 2px 12px rgba(0,0,0,0.1);
  }
  #panel h2 { font-size: 14px; margin-bottom: 14px; color: #444; letter-spacing: 1px; text-transform: uppercase; }

  .part-btn {
    display: block; width: 100%; padding: 8px 12px; margin-bottom: 6px;
    font-size: 13px; text-align: left;
    background: #f5f5f5; border: 1px solid #ddd; border-radius: 6px;
    color: #555; cursor: pointer; transition: all 0.15s;
  }
  .part-btn:hover { background: #eef; color: #333; border-color: #aac; }
  .part-btn.active { background: #e0e8f5; border-color: #88aadd; color: #333; font-weight: 600; }
  .part-btn .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }

  .sep { height: 1px; background: #ddd; margin: 12px 0; }

  .ctrl-row { display: flex; gap: 6px; margin-top: 4px; }
  .ctrl-btn {
    flex: 1; padding: 6px 0; font-size: 11px; text-align: center;
    background: #f0f0f0; border: 1px solid #ccc; border-radius: 5px;
    color: #666; cursor: pointer; transition: background 0.15s;
  }
  .ctrl-btn:hover { background: #e0e0ee; color: #333; }
  .ctrl-btn.on { background: #d0d8ee; color: #336; }

  #status { margin-top: 10px; font-size: 11px; color: #888; }

  #info {
    position: fixed; bottom: 14px; left: 16px; z-index: 10;
    font-size: 11px; color: #999;
  }
</style>
</head>
<body>

<div id="panel">
  <h2>Nice Dreamz — 4 Metal Parts</h2>

  <button class="part-btn active" data-part="all">
    <span class="dot" style="background:#888"></span>Show All
  </button>
  <button class="part-btn" data-part="bottom">
    <span class="dot" style="background:#E8A030"></span>Bottom Cap
  </button>
  <button class="part-btn" data-part="base">
    <span class="dot" style="background:#7090C0"></span>Chamber (Base Body)
  </button>
  <button class="part-btn" data-part="top">
    <span class="dot" style="background:#40B060"></span>Top Cap
  </button>
  <button class="part-btn" data-part="lid">
    <span class="dot" style="background:#C05070"></span>Lid Assembly
  </button>

  <div class="sep"></div>

  <div class="ctrl-row">
    <div class="ctrl-btn" id="btn-reset">Reset View</div>
    <div class="ctrl-btn" id="btn-wire">Wireframe</div>
  </div>

  <div id="status">Loading...</div>
</div>

<div id="info">Orbit: Left-click drag | Zoom: Scroll | Pan: Right-click drag</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
var statusEl = document.getElementById('status');

try {

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf0f0f0);

  var camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 5000);
  camera.position.set(0, 350, 650);

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;

  // Lighting — bright, even, from all sides
  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  var lights = [
    { pos: [300, 400, 200], int: 0.7 },
    { pos: [-300, 300, -200], int: 0.5 },
    { pos: [0, -200, 300], int: 0.4 },
    { pos: [200, 100, -300], int: 0.4 },
    { pos: [-200, 400, 200], int: 0.3 }
  ];
  for (var i = 0; i < lights.length; i++) {
    var dl = new THREE.DirectionalLight(0xffffff, lights[i].int);
    dl.position.set(lights[i].pos[0], lights[i].pos[1], lights[i].pos[2]);
    scene.add(dl);
  }
  scene.add(new THREE.HemisphereLight(0xddeeff, 0x888888, 0.6));

  // Grid
  var grid = new THREE.GridHelper(1000, 50, 0xcccccc, 0xe0e0e0);
  scene.add(grid);

  // Part config
  var LFS = 'https://media.githubusercontent.com/media/nicedreamzapp/Heat-N-Clean-Glass-Oven/main/CAD%20Exports/Individual%20Parts/GLB';
  var SPACING = 200;

  var PARTS = {
    bottom: { file: LFS + '/02_Bottom_Cap.glb',  color: 0xE8A030, emissive: 0x3A2808, label: 'Bottom Cap',  xOff: -SPACING * 1.5 },
    base:   { file: LFS + '/01_Base_Body.glb',   color: 0x7090C0, emissive: 0x1C2430, label: 'Chamber',     xOff: -SPACING * 0.5 },
    top:    { file: LFS + '/03_Top_Cap.glb',     color: 0x40B060, emissive: 0x102C18, label: 'Top Cap',     xOff:  SPACING * 0.5 },
    lid:    { file: LFS + '/04_Lid_Assembly.glb', color: 0xC05070, emissive: 0x30141C, label: 'Lid Assembly', xOff:  SPACING * 1.5 }
  };

  var partGroups = {};
  var partCenters = {};
  var wireframeMode = false;
  var loadedCount = 0;
  var loader = new THREE.GLTFLoader();

  function loadPart(key) {
    var cfg = PARTS[key];
    statusEl.textContent = 'Loading ' + cfg.label + '...';
    statusEl.style.color = '#cc8800';

    loader.load(cfg.file, function(gltf) {
      var group = gltf.scene;

      var box = new THREE.Box3().setFromObject(group);
      var center = box.getCenter(new THREE.Vector3());
      group.position.set(cfg.xOff - center.x, -center.y, -center.z);

      group.traverse(function(child) {
        if (child.isMesh) {
          child.material = new THREE.MeshPhongMaterial({
            color: cfg.color,
            emissive: cfg.emissive,
            specular: 0x444444,
            shininess: 40,
            side: THREE.DoubleSide
          });
        }
      });

      scene.add(group);
      partGroups[key] = group;

      var placedBox = new THREE.Box3().setFromObject(group);
      partCenters[key] = placedBox.getCenter(new THREE.Vector3());

      loadedCount++;
      if (loadedCount >= 4) {
        statusEl.textContent = 'All 4 parts loaded';
        statusEl.style.color = '#44aa44';
        fitAll();
      } else {
        var keys = Object.keys(PARTS);
        var nextIdx = keys.indexOf(key) + 1;
        if (nextIdx < keys.length) loadPart(keys[nextIdx]);
      }
    }, null, function(err) {
      console.error('Failed: ' + key, err);
      statusEl.textContent = 'Error loading ' + cfg.label;
      statusEl.style.color = '#cc3333';
      loadedCount++;
      var keys = Object.keys(PARTS);
      var nextIdx = keys.indexOf(key) + 1;
      if (nextIdx < keys.length) loadPart(keys[nextIdx]);
    });
  }

  loadPart('bottom');

  function fitTo(box) {
    var center = box.getCenter(new THREE.Vector3());
    var size = box.getSize(new THREE.Vector3());
    var dist = Math.max(size.x, size.y, size.z) * 1.6;
    controls.target.copy(center);
    camera.position.set(center.x + dist * 0.5, center.y + dist * 0.4, center.z + dist * 0.6);
    controls.update();
  }

  function fitAll() {
    var box = new THREE.Box3();
    var keys = Object.keys(partGroups);
    for (var i = 0; i < keys.length; i++) {
      if (partGroups[keys[i]].visible) box.expandByObject(partGroups[keys[i]]);
    }
    if (!box.isEmpty()) fitTo(box);
  }

  // Part selection
  var buttons = document.querySelectorAll('.part-btn');
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].addEventListener('click', function() {
      var key = this.dataset.part;
      for (var j = 0; j < buttons.length; j++) {
        buttons[j].classList.toggle('active', buttons[j].dataset.part === key);
      }
      var keys = Object.keys(partGroups);
      for (var k = 0; k < keys.length; k++) {
        partGroups[keys[k]].visible = (key === 'all' || key === keys[k]);
      }
      fitAll();
    });
  }

  document.getElementById('btn-reset').addEventListener('click', fitAll);

  document.getElementById('btn-wire').addEventListener('click', function() {
    wireframeMode = !wireframeMode;
    this.classList.toggle('on', wireframeMode);
    var keys = Object.keys(partGroups);
    for (var i = 0; i < keys.length; i++) {
      partGroups[keys[i]].traverse(function(child) {
        if (child.isMesh) child.material.wireframe = wireframeMode;
      });
    }
  });

  window.addEventListener('resize', function() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  (function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  })();

} catch(e) {
  statusEl.textContent = 'ERROR: ' + e.message;
  statusEl.style.color = '#cc3333';
  console.error(e);
}
</script>
</body>
</html>
