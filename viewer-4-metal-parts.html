<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heat-N-Clean — 4 Main Metal Parts</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #2a2a3a; color: #eee; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; position: fixed; top: 0; left: 0; z-index: 0; }

  #panel {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    background: rgba(16, 16, 32, 0.93); border: 1px solid #333;
    border-radius: 10px; padding: 16px 18px; min-width: 240px;
    backdrop-filter: blur(12px);
  }
  #panel h2 { font-size: 14px; margin-bottom: 14px; color: #99aacc; letter-spacing: 1px; text-transform: uppercase; }

  .part-btn {
    display: block; width: 100%; padding: 8px 12px; margin-bottom: 6px;
    font-size: 13px; text-align: left;
    background: #1e1e33; border: 1px solid #333; border-radius: 6px;
    color: #ccc; cursor: pointer; transition: all 0.15s;
  }
  .part-btn:hover { background: #2a2a44; color: #fff; border-color: #556; }
  .part-btn.active { background: #2d3a5a; border-color: #5577cc; color: #fff; }
  .part-btn .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }

  .sep { height: 1px; background: #333; margin: 12px 0; }

  .ctrl-row { display: flex; gap: 6px; margin-top: 4px; }
  .ctrl-btn {
    flex: 1; padding: 6px 0; font-size: 11px; text-align: center;
    background: #1e1e33; border: 1px solid #333; border-radius: 5px;
    color: #999; cursor: pointer; transition: background 0.15s;
  }
  .ctrl-btn:hover { background: #2a2a44; color: #ddd; }
  .ctrl-btn.on { background: #334466; color: #aaccff; }

  #status { margin-top: 10px; font-size: 11px; color: #888; }

  #info {
    position: fixed; bottom: 14px; left: 16px; z-index: 10;
    font-size: 11px; color: #555;
  }

  #legend {
    position: fixed; top: 16px; right: 16px; z-index: 10;
    background: rgba(16, 16, 32, 0.93); border: 1px solid #333;
    border-radius: 10px; padding: 14px 16px; min-width: 220px;
    backdrop-filter: blur(12px); font-size: 12px; color: #999;
    display: none;
  }
  #legend h3 { font-size: 12px; color: #88aacc; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
</style>
</head>
<body>

<div id="panel">
  <h2>Nice Dreamz — 4 Metal Parts</h2>

  <button class="part-btn active" data-part="all">
    <span class="dot" style="background:#88aacc"></span>Show All
  </button>
  <button class="part-btn" data-part="bottom">
    <span class="dot" style="background:#DCB044"></span>02 — Bottom Cap
  </button>
  <button class="part-btn" data-part="base">
    <span class="dot" style="background:#B4BEC8"></span>01 — Chamber (Base Body)
  </button>
  <button class="part-btn" data-part="top">
    <span class="dot" style="background:#50C850"></span>03 — Top Cap
  </button>
  <button class="part-btn" data-part="lid">
    <span class="dot" style="background:#50A0DC"></span>04 — Lid Assembly
  </button>

  <div class="sep"></div>

  <div class="ctrl-row">
    <div class="ctrl-btn" id="btn-reset">Reset</div>
    <div class="ctrl-btn" id="btn-wire">Wireframe</div>
  </div>
  <div class="ctrl-row" style="margin-top:6px">
    <div class="ctrl-btn" id="btn-grid">Grid</div>
    <div class="ctrl-btn" id="btn-info">Part Info</div>
  </div>

  <div id="status">Initializing...</div>
</div>

<div id="legend">
  <h3>Part Details</h3>
  <div id="legend-content"></div>
</div>

<div id="info">Orbit: Left-click drag | Zoom: Scroll | Pan: Right-click drag</div>

<!-- Three.js r150 — last version with classic (non-module) scripts -->
<script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
var statusEl = document.getElementById('status');

function setStatus(msg, color) {
  statusEl.textContent = msg;
  statusEl.style.color = color || '#888';
}

try {
  setStatus('Setting up scene...', '#ffaa44');

  // Scene
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x2a2a3a);

  // Camera
  var camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 5000);
  camera.position.set(0, 350, 650);

  // Renderer
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.8;
  document.body.appendChild(renderer.domElement);

  // Controls
  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;

  // Lighting
  scene.add(new THREE.AmbientLight(0xffffff, 1.0));
  var d1 = new THREE.DirectionalLight(0xffffff, 2.0);
  d1.position.set(200, 300, 150);
  scene.add(d1);
  var d2 = new THREE.DirectionalLight(0xffffff, 1.2);
  d2.position.set(-150, 200, -100);
  scene.add(d2);
  var d3 = new THREE.DirectionalLight(0xffffff, 0.8);
  d3.position.set(0, -100, 200);
  scene.add(d3);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444466, 1.0));

  // Grid & Axes
  var grid = new THREE.GridHelper(1000, 50, 0x3a3a55, 0x2a2a44);
  scene.add(grid);
  var axes = new THREE.AxesHelper(50);
  scene.add(axes);

  // Part definitions — colors match Python export script
  var LFS = 'https://media.githubusercontent.com/media/nicedreamzapp/Heat-N-Clean-Glass-Oven/main/CAD%20Exports/Individual%20Parts/GLB';
  var SPACING = 200;

  var PARTS = {
    bottom: { file: LFS + '/02_Bottom_Cap.glb',   color: 0xDCB044, label: '02 - Bottom Cap',  desc: '304 SS, 1.2mm — Disk with rolled lip, M4/M6 screw holes',          xOff: -SPACING * 1.5 },
    base:   { file: LFS + '/01_Base_Body.glb',     color: 0xB4BEC8, label: '01 - Base Body',   desc: '304 SS, 1.2mm — Inner housing + outer mesh + support ring + fins',  xOff: -SPACING * 0.5 },
    top:    { file: LFS + '/03_Top_Cap.glb',        color: 0x50C850, label: '03 - Top Cap',     desc: '304 SS, 1.2mm — Annular ring, compound-curved grooves (stamped)',   xOff:  SPACING * 0.5 },
    lid:    { file: LFS + '/04_Lid_Assembly.glb',   color: 0x50A0DC, label: '04 - Lid Assembly', desc: '304 SS, 1.2mm — 6 welded sub-parts + handle + hinge tabs',         xOff:  SPACING * 1.5 }
  };

  var partGroups = {};
  var partCenters = {};
  var wireframeMode = false;
  var loadedCount = 0;
  var loader = new THREE.GLTFLoader();

  setStatus('Loading 4 parts...', '#ffaa44');

  function loadPart(key) {
    var cfg = PARTS[key];
    setStatus('Loading ' + cfg.label + '...', '#ffaa44');

    loader.load(
      cfg.file,
      function(gltf) {
        var group = gltf.scene;

        // Center part then offset to its lane
        var box = new THREE.Box3().setFromObject(group);
        var center = box.getCenter(new THREE.Vector3());
        group.position.set(cfg.xOff - center.x, -center.y, -center.z);

        // Apply colored material
        group.traverse(function(child) {
          if (child.isMesh) {
            child.material = new THREE.MeshStandardMaterial({
              color: cfg.color,
              metalness: 0.35,
              roughness: 0.5,
              side: THREE.DoubleSide
            });
          }
        });

        scene.add(group);
        partGroups[key] = group;

        var placedBox = new THREE.Box3().setFromObject(group);
        partCenters[key] = placedBox.getCenter(new THREE.Vector3());

        loadedCount++;
        if (loadedCount >= 4) {
          setStatus('All 4 parts loaded', '#44cc66');
          fitAll();
        } else {
          // Load next part
          var keys = Object.keys(PARTS);
          var nextIdx = keys.indexOf(key) + 1;
          if (nextIdx < keys.length) loadPart(keys[nextIdx]);
        }
      },
      function(progress) {
        if (progress.total > 0) {
          var pct = Math.round((progress.loaded / progress.total) * 100);
          setStatus('Loading ' + cfg.label + '... ' + pct + '%', '#ffaa44');
        }
      },
      function(err) {
        console.error('Failed to load ' + key, err);
        setStatus('Error loading ' + cfg.label, '#ff4466');
        // Still try loading next
        loadedCount++;
        var keys = Object.keys(PARTS);
        var nextIdx = keys.indexOf(key) + 1;
        if (nextIdx < keys.length) loadPart(keys[nextIdx]);
      }
    );
  }

  // Start loading sequentially (less strain on connections)
  loadPart('bottom');

  // Camera fitting
  function fitTo(box) {
    var center = box.getCenter(new THREE.Vector3());
    var size = box.getSize(new THREE.Vector3());
    var dist = Math.max(size.x, size.y, size.z) * 1.6;
    controls.target.copy(center);
    camera.position.set(center.x + dist * 0.5, center.y + dist * 0.4, center.z + dist * 0.6);
    controls.update();
  }

  function fitAll() {
    var box = new THREE.Box3();
    var keys = Object.keys(partGroups);
    for (var i = 0; i < keys.length; i++) {
      if (partGroups[keys[i]].visible) box.expandByObject(partGroups[keys[i]]);
    }
    if (!box.isEmpty()) fitTo(box);
  }

  // Part selection
  var activePart = 'all';
  var buttons = document.querySelectorAll('.part-btn');
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].addEventListener('click', function() {
      var key = this.dataset.part;
      activePart = key;
      for (var j = 0; j < buttons.length; j++) {
        buttons[j].classList.toggle('active', buttons[j].dataset.part === key);
      }
      var keys = Object.keys(partGroups);
      for (var k = 0; k < keys.length; k++) {
        partGroups[keys[k]].visible = (key === 'all' || key === keys[k]);
      }
      fitAll();
      updateLegend();
    });
  }

  // Controls
  document.getElementById('btn-reset').addEventListener('click', fitAll);

  document.getElementById('btn-wire').addEventListener('click', function() {
    wireframeMode = !wireframeMode;
    this.classList.toggle('on', wireframeMode);
    var keys = Object.keys(partGroups);
    for (var i = 0; i < keys.length; i++) {
      partGroups[keys[i]].traverse(function(child) {
        if (child.isMesh) child.material.wireframe = wireframeMode;
      });
    }
  });

  document.getElementById('btn-grid').addEventListener('click', function() {
    grid.visible = !grid.visible;
    axes.visible = !axes.visible;
    this.classList.toggle('on', !grid.visible);
  });

  // Legend
  var legendEl = document.getElementById('legend');
  var legendContent = document.getElementById('legend-content');
  var showInfo = false;

  function updateLegend() {
    if (!showInfo) return;
    var html = '';
    var keys = activePart === 'all' ? Object.keys(PARTS) : [activePart];
    for (var i = 0; i < keys.length; i++) {
      var p = PARTS[keys[i]];
      if (!p) continue;
      var c = '#' + p.color.toString(16).padStart(6, '0');
      html += '<div style="margin-bottom:8px"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + c + ';margin-right:6px;vertical-align:middle"></span><span style="color:#bbb">' + p.label + '</span><br><span style="color:#777;font-size:11px;margin-left:14px">' + p.desc + '</span></div>';
    }
    legendContent.innerHTML = html;
  }

  document.getElementById('btn-info').addEventListener('click', function() {
    showInfo = !showInfo;
    this.classList.toggle('on', showInfo);
    legendEl.style.display = showInfo ? 'block' : 'none';
    updateLegend();
  });

  // Resize
  window.addEventListener('resize', function() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // Render loop
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

} catch(e) {
  setStatus('ERROR: ' + e.message, '#ff4466');
  console.error(e);
}
</script>

</body>
</html>
