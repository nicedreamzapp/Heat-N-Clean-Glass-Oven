<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heat-N-Clean — heater coil and lead connection</title>
<style>
html,body{margin:0;height:100%;background:#eef1f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#222;overflow:hidden}
canvas{display:block}
#step{position:absolute;top:10px;left:12px;max-width:min(760px,calc(100% - 24px));background:#fff;border-left:5px solid #d08a00;padding:10px 14px;border-radius:8px;font-size:17px;line-height:1.4;z-index:10;box-shadow:0 4px 18px rgba(0,0,0,.12)}
#step small{display:block;color:#666;font-size:13px;margin-bottom:3px}
#ctl{position:absolute;bottom:58px;left:12px;background:rgba(255,255,255,.92);padding:8px 12px;border-radius:10px;display:flex;gap:8px;align-items:center;font-size:14px;flex-wrap:wrap;z-index:10;max-width:calc(100% - 24px)}
#ctl button{font-size:14px;padding:6px 12px;border-radius:8px;border:1px solid #c8ccd2;background:#fff;cursor:pointer}
#ctl button.on{background:#1f5fb3;color:#fff;border-color:#1f5fb3}
#key{position:absolute;bottom:12px;left:12px;background:rgba(255,255,255,.92);padding:8px 12px;border-radius:10px;font-size:13px;z-index:10;display:flex;gap:6px 14px;flex-wrap:wrap;max-width:calc(100% - 24px)}
#key i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.08);z-index:10}#bar i{display:block;height:100%;width:0;background:#1f5fb3}
.lbl{background:rgba(255,255,255,.94);border:1px solid #c8ccd2;border-radius:6px;padding:2px 7px;font-size:12px;white-space:nowrap;pointer-events:none}
#parts{position:absolute;top:132px;left:12px;background:rgba(255,255,255,.94);padding:8px 10px;border-radius:10px;display:flex;flex-direction:column;gap:5px;z-index:10;font-size:13px}
#parts b{font-size:13px;margin-bottom:2px}#parts button{font-size:13px;padding:5px 10px;border-radius:7px;border:1px solid #c8ccd2;background:#fff;cursor:pointer;text-align:left}
#parts button.on{background:#d08a00;color:#fff;border-color:#d08a00}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script>
</head><body>
<div id="step"><small>Heater coil and lead connection — on the 11-12 oven parts</small><span id="stxt">Loading the oven parts…</span></div>
<div id="ctl">
 <button id="play">▶ Play build</button>
 <button id="prev">◀</button><button id="next">▶</button>
 <button id="cut">Cut in half</button>
 <button id="zoom">Zoom to connection</button>
 <button id="labels" class="on">Labels</button>
</div>
<div id="key">
 <span><i style="background:#e8e2d4"></i>ceramic</span>
 <span><i style="background:#e0782a"></i>kanthal (coil and its doubled lead, one wire)</span>
 <span><i style="background:#ffffff;border:1px solid #999"></i>steatite beads</span>
 <span><i style="background:#f5f0e0;border:1px solid #999"></i>Skutt porcelain insulators</span>
 <span><i style="background:#9fb3c8"></i>nickel crimp</span>
 <span><i style="background:#f4f4f4;border:1px solid #bbb"></i>MG high-temp wire</span>
 <span><i style="background:#9aa4ae"></i>steel parts</span>
 <span><i style="background:#8a6d4a"></i>thermocouple</span>
</div>
<div id="parts"><b>Connection parts, close up</b></div>
<div id="bar"><i></i></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {STLLoader} from 'three/addons/loaders/STLLoader.js';
import {CSS2DRenderer,CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';

// Oven frame, mm, z up. Real parts = viewer-full/*.glb (FAB_PACKAGE_2026-11-12), embedded below.
// Lead holes (Scripts/hnc_params.py, 2026-11-20): 145° and 173°. 03: Ø10 at r 53.5 (2026-11-21, was Ø8: the Ø8 porcelain beads pass). 04: Ø11.5 at r 49 for the
// Skutt porcelain insulator (body Ø11.2, lip Ø22.1 on the floor, body down out of the oven).
// 03 outer plate top z -5.5, 04 floor top z -31.7 (25.4 mm open space between). Slots 23.5 deep.
const MODELS=__MODELS__;
const WIRE_R=53.5, LEADS=[145,173], SLOT_D=23.5, PLATE_TOP=-5.5, PLATE_BOT=-6.3, CAP_TOP=-31.7, CAP_BOT=-32.9;
const D=Math.PI/180, P=(r,deg,z)=>new THREE.Vector3(r*Math.cos(deg*D),r*Math.sin(deg*D),z);

const scene=new THREE.Scene(); scene.background=new THREE.Color(0xeef1f5);
const cam=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,1,4000); cam.up.set(0,0,1);
const ren=new THREE.WebGLRenderer({antialias:true}); ren.setPixelRatio(devicePixelRatio); ren.setSize(innerWidth,innerHeight);
ren.localClippingEnabled=true; document.body.appendChild(ren.domElement);
const lr=new CSS2DRenderer(); lr.setSize(innerWidth,innerHeight); Object.assign(lr.domElement.style,{position:'absolute',top:0,pointerEvents:'none'}); document.body.appendChild(lr.domElement);
const ctl=new OrbitControls(cam,ren.domElement); ctl.enableDamping=true;
scene.add(new THREE.AmbientLight(0xffffff,0.9));
const d1=new THREE.DirectionalLight(0xffffff,1.4); d1.position.set(150,-200,400); scene.add(d1);
const d2=new THREE.DirectionalLight(0xaabbdd,0.6); d2.position.set(-200,150,-100); scene.add(d2);
scene.add(new THREE.HemisphereLight(0xddeeff,0x888888,0.5));

// cut plane holds the two leads (160-170°) on its face
const clip=new THREE.Plane(P(1,249,0),3); let clipOn=false;
const mats=[];
function M(color,o={}){const m=new THREE.MeshStandardMaterial({color,roughness:o.rough??.6,metalness:o.metal??0,transparent:o.op!==undefined,opacity:o.op??1,depthWrite:o.op===undefined,side:THREE.DoubleSide,emissive:o.em??0});mats.push(m);return m}
const mCer=M(0xe8e2d4,{rough:.85}), mKan=M(0xe0782a,{rough:.4,metal:.45,em:0x3a1000}), mBead=M(0xffffff,{rough:.8,op:.3});
const mPorc=M(0xf5f0e0,{rough:.3}), mCrimp=M(0x9fb3c8,{rough:.35,metal:.35}), mMG=M(0xf4f4f4,{rough:.9});
const mSteel=M(0x9aa4ae,{rough:.4,metal:.45}), mSteelT=M(0x9aa4ae,{rough:.4,metal:.45,op:.28}), mBolt=M(0x707880,{rough:.4,metal:.5});

const groups=[]; function G(){const g=new THREE.Group();scene.add(g);groups.push(g);return g}
const labels=[]; function L(g,text,pos){const d=document.createElement('div');d.className='lbl';d.textContent=text;const o=new CSS2DObject(d);o.position.copy(pos);g.add(o);labels.push(o)}
function tube(points,r,mat,seg=200){return new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points),seg,r,10,false),mat)}
function zcyl(r,z0,z1,pos,mat,ri){const g=ri?new THREE.CylinderGeometry(r,r,z1-z0,32,1,true):new THREE.CylinderGeometry(r,r,z1-z0,32);g.rotateX(Math.PI/2);const m=new THREE.Mesh(g,mat);m.position.set(pos.x,pos.y,(z0+z1)/2);return m}
function annulus(ri,ro,z0,z1,pos,mat){const s=new THREE.Shape();s.absarc(0,0,ro,0,Math.PI*2);const h=new THREE.Path();h.absarc(0,0,ri,0,Math.PI*2,true);s.holes.push(h);
  const g=new THREE.ExtrudeGeometry(s,{depth:z1-z0,bevelEnabled:false,curveSegments:32});const m=new THREE.Mesh(g,mat);m.position.set(pos.x,pos.y,z0);return m}

const loader=new GLTFLoader();
const load=k=>new Promise(res=>loader.load(MODELS[k],g=>{g.scene.traverse(c=>{if(c.isMesh){c.geometry.deleteAttribute('color');c.geometry.computeVertexNormals()}});res(g.scene)},undefined,()=>res(null)));
const part=async(k,mat,g)=>{const m=await load(k);if(!m)return null;m.traverse(c=>{if(c.isMesh)c.material=mat});g.add(m);return m};

// Build order = the approved oven build animation (viewer-oven.html), with the legs moved up to right after 04 (Matt 11/20:
// legs go on early, so 03 has no leg holes) and the Skutt insulators dropped into 04 before 03 closes the floor off.
const g04=G(); await part('04',mSteel,g04); L(g04,'04 Bottom Cap',P(68,125,CAP_TOP-4));
const R04=49;
for(const a of LEADS){const p=P(R04,a,0);
  g04.add(zcyl(11.05,CAP_TOP,CAP_TOP+3,p,mPorc)); g04.add(zcyl(5.6,CAP_TOP-8,CAP_TOP,p,mPorc));   // body 8 mm long: drawn short, real length not published
  const hole=new THREE.Mesh(new THREE.CylinderGeometry(2.3,2.3,11.2,24),M(0x555555));hole.geometry.rotateX(Math.PI/2);hole.position.set(p.x,p.y,CAP_TOP-2.4);g04.add(hole)}
L(g04,'Skutt porcelain insulators in 04 (lip on the floor)',P(R04+4,LEADS[0]-8,CAP_TOP+4));
const gLeg=G(); await part('feet',mCer,gLeg); await part('legscrews',mBolt,gLeg); L(gLeg,'3 ceramic feet + leg screws',P(60,245,CAP_BOT-14));
const g01=G(); await part('01',mSteelT,g01); L(g01,'01 Inner Wall Tube',P(61,40,60));
const gSb=G(); await part('spacer_bot',mCer,gSb);
const g02=G(); await part('02',M(0x9aa4ae,{rough:.4,metal:.45,op:.18}),g02); L(g02,'02 Outer Perforated Tube',P(66,20,40));
const gBb=G(); await part('bolts_bot',mBolt,gBb);
const g03=G(); await part('03',mSteel,g03); L(g03,'03 Support Ring',P(71,120,PLATE_TOP+1)); L(g03,'25 mm open space',P(45,165,-19));
const gSs=G(); await part('spacer_seat',mCer,gSs);
const gBs=G(); await part('bolts_seat',mBolt,gBs);
const gBd=G(); await part('basedisk',mCer,gBd);
// the real ceramic core = our C1 CAD (PRINT_SET_2026-11-12/STL/C1_Ceramic_Heater_Core.stl): 29 coil grooves + the Ø6.4 temp-probe hole at 314.6°.
const g2=G();
const cpos=await load('core'); const cb=new THREE.Box3().setFromObject(cpos);
const c1g=new STLLoader().parse(await (await fetch(MODELS.c1)).arrayBuffer()); c1g.computeBoundingBox();
const core=new THREE.Mesh(c1g,mCer); core.position.z=cb.min.z-c1g.boundingBox.min.z; g2.add(core);
const CZ=core.position.z;
L(g2,'Ceramic heater core',P(46,200,cb.max.z+3));
const R=46.25, Z0=CZ+17.2, Z1=CZ+64.8, TURNS=28;   // C1 grooves: 29, z 17.2 to 64.8 on the core
const coil=[]; const tot=TURNS*360+(LEADS[1]-LEADS[0]);
for(let i=0;i<=1600;i++){const t=i/1600;coil.push(P(R,LEADS[0]+t*tot,Z0+t*(Z1-Z0)))}
g2.add(tube(coil,0.6,mKan,3000));
const beadG=new THREE.Group(); groups.push(beadG); scene.add(beadG);
function lead(center){
  const c=new THREE.CatmullRomCurve3(center), n=500, fr=c.computeFrenetFrames(n,false), len=c.getLength();
  const s1=[],s2=[];
  for(let i=0;i<=n;i++){const t=i/n,p=c.getPointAt(t),a=t*len/4*Math.PI*2,off=t<0.02?t/0.02*0.75:0.75;
    const v=fr.normals[i].clone().multiplyScalar(Math.cos(a)*off).add(fr.binormals[i].clone().multiplyScalar(Math.sin(a)*off));
    s1.push(p.clone().add(v)); s2.push(p.clone().sub(v))}
  // the fold: strand 1 turns around at the bottom and comes back up as strand 2, one continuous wire
  const fold=[];const pe=c.getPointAt(1),te=c.getTangentAt(1),ve=s1[n].clone().sub(pe);
  for(let i=0;i<=12;i++){const a=i/12*Math.PI;fold.push(pe.clone().add(ve.clone().multiplyScalar(Math.cos(a))).add(te.clone().multiplyScalar(Math.sin(a)*1.2)))}
  const wire=[...s1,...fold.slice(1,-1),...s2.slice().reverse()];
  g2.add(tube(wire,0.5,mKan,2400));
  for(let d=4;d<len;d+=7.2){const t=d/len,p=c.getPointAt(t);if(p.z<PLATE_BOT-3)break;
    const b=new THREE.Mesh(new THREE.CylinderGeometry(4,3,7,20),mBead);b.position.copy(p);b.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),c.getTangentAt(t));beadG.add(b)}
}
// leads: down the insulation space and through 03 (Ø10, r 53.5); the crimp sits in the chamber under 03 (Matt 11/20).
// It is crimped on the bench first, then crimp + MG wire feed down through the Ø10 hole in 03 (crimp Ø4.8 passes).
function leadPath(a,top){return [...top,P(WIRE_R,a,PLATE_TOP),P(WIRE_R,a,-11)]}
lead(leadPath(LEADS[0],[P(R,LEADS[0],Z0),P(49,LEADS[0],Z0-2),P(WIRE_R,LEADS[0],Z0-5)]));
lead(leadPath(LEADS[1],[P(R,LEADS[1],Z1),P(50,LEADS[1],Z1-3),P(50.5,LEADS[1],(Z0+Z1)/2),P(51.5,LEADS[1],Z0+2),P(WIRE_R,LEADS[1],Z0-5)]));
const gTC=new THREE.Group(); g2.add(gTC); const mTC=M(0x8a6d4a,{rough:.5,metal:.3});
gTC.add(tube([P(41,314.6,CZ+8.2),P(46.5,314.6,CZ+8.2),P(51,315,CZ+7),P(WIRE_R,315,CZ+2),P(WIRE_R,315,PLATE_TOP),P(WIRE_R,315,CAP_BOT-8),P(WIRE_R+20,312,CAP_BOT-16),P(WIRE_R+50,308,CAP_BOT-18)],1.5,mTC,160));
L(gTC,'Thermocouple in the core temp hole',P(49,314.6,CZ+12));
L(g2,'Kanthal coil (same wire as the leads)',P(R+2,250,(Z0+Z1)/2));
L(g2,'Lead: same kanthal, folded in half + twisted',P(52,LEADS[1],Z1-6));
L(beadG,'Steatite beads over the twisted lead',P(WIRE_R+3,LEADS[0],Z0-3));
// joint in the chamber under 03: crimp standing in the 25 mm space, MG wire down through the 04 insulator and out
const g5=G(); const UNDER=CAP_BOT-10;
for(const a of LEADS){
  g5.add(zcyl(2.4,-23,-12,P(WIRE_R,a,0),mCrimp));
  g5.add(tube([P(WIRE_R,a,-23),P(WIRE_R-1.5,a,-26),P(R04,a,CAP_TOP+1),P(R04,a,UNDER+2),P(R04+3,a,UNDER),P(R04+40,a-4,UNDER),P(R04+70,a-6,UNDER)],1.6,mMG,140))}
L(g5,'Nickel crimp in the chamber under 03 (kanthal in, MG wire out)',P(WIRE_R+5,LEADS[1],-17));
L(g5,'MG wire out through the 04 insulator to the controller box',P(R04+66,LEADS[0]-6,UNDER-5));

const STEPS=[
 ['04 + insulators','Bottom Cap 04 on the bench, rim up. The two Skutt porcelain insulators drop into the Ø11.5 lead holes, lip on the floor, body down.'],
 ['Legs','The 3 ceramic feet screw on now, early. The leg screws stand on the 04 floor, so 03 has no leg holes.'],
 ['01 inner tube','Inner Wall Tube 01 stands inside the cap.'],
 ['Bottom spacer','Bottom ceramic spacer slides down over the inner tube; holes lined up.'],
 ['02 outer tube','Outer Perforated Tube 02 slides down over everything.'],
 ['Bottom bolts','5 bottom M6 bolts: cap rim, outer tube, spacer, inner tube. Nuts inside.'],
 ['03 support ring','Insulation pad in the bottom, then Support Ring 03 drops in to the seat holes.'],
 ['Seat spacer','Seat ceramic spacer into the gap between the tubes.'],
 ['Seat bolts','5 seat bolts through outer tube, spacer, inner tube and the 03 wall.'],
 ['Base disk','Ceramic base disk onto the raised seat of 03.'],
 ['Core, coil, leads','The C1 core with the kanthal coil in its grooves. Each lead is the same wire, folded in half and twisted. The thermocouple goes in the core temp hole.'],
 ['Beads + crimp on the bench','Steatite beads over each twisted lead, then on the bench each lead is crimped to MG high-temp wire with a nickel crimp. No screw.'],
 ['Feed down','The MG wire and crimp feed down through the Ø10 hole in 03 (the crimp passes), so the crimp sits in the chamber under 03, and the MG wire goes out through the Skutt insulator in 04 to the controller box. Pack the side insulation and go on with the top cap.'],
];
let cur=STEPS.length-1;
const stxt=document.getElementById('stxt'), bar=document.querySelector('#bar i');
function show(n,anim){cur=n;groups.forEach((g,i)=>{g.visible=i<=n;if(anim&&i===n)g.userData.t0=performance.now()});
  stxt.innerHTML=`<b>${n+1}/${STEPS.length} ${STEPS[n][0]}.</b> ${STEPS[n][1]}`;bar.style.width=((n+1)/STEPS.length*100)+'%'}
let timer=null;
document.getElementById('play').onclick=()=>{clearInterval(timer);show(0,true);let i=0;timer=setInterval(()=>{i++;if(i>=STEPS.length){clearInterval(timer);return}show(i,true)},3600)};
document.getElementById('prev').onclick=()=>{clearInterval(timer);show(Math.max(0,cur-1),true)};
document.getElementById('next').onclick=()=>{clearInterval(timer);show(Math.min(STEPS.length-1,cur+1),true)};
let zoomed=false;
const bc=document.getElementById('cut');function setCut(on){clipOn=on;bc.classList.toggle('on',clipOn);mats.forEach(m=>{m.clippingPlanes=clipOn?[clip]:[];m.needsUpdate=true})}
bc.onclick=()=>{setCut(!clipOn);if(clipOn&&!zoomed){ctl.target.copy(home.t);cam.position.copy(P(330,69,140))}};
const bl=document.getElementById('labels');bl.onclick=()=>{const on=!bl.classList.contains('on');bl.classList.toggle('on',on);labels.forEach(l=>l.visible=on)};

// part close-ups: cut in half, fly to the part, make it glow, explain it
const PARTS_CU=[
 ['Doubled + twisted lead',[mKan],()=>P(50,173,CZ+34),'The same kanthal as the coil, folded in half and twisted on itself from where the coil stops. Two strands share the current, so the lead runs cool and stops cooking the joint.'],
 ['Porcelain beads',[mBead],()=>P(WIRE_R,159,CZ+4),'Tapered porcelain beads (3 mm hole, 8 mm wide, 7 mm long) strung over the twisted lead through the insulation. Good to about 1000°C, they never fray like fiber sleeve and keep the wire off everything.'],
 ['Beads through 03',[mBead],()=>P(WIRE_R,159,PLATE_TOP-1),'The beaded lead passes straight through the Ø10 hole in the 03 support ring (1 mm clear around the 8 mm beads). The ceramic beads keep the kanthal off the steel edge, the way kilns pass beaded leads through brick.'],
 ['Nickel crimp',[mCrimp],()=>P(WIRE_R,159,-17),'A bare nickel-plated barrel: kanthal in one end, MG wire in the other, squeezed with a crimper on the bench. No screw to oxidize or loosen, good to about 650°C. It sits in the chamber under 03.'],
 ['MG high-temp wire',[mMG],()=>P(R04,159,CAP_BOT-10),'Mica and fiberglass insulated power wire, rated 450°C. It carries the power from the crimp out of the oven to the controller box.'],
 ['Skutt insulator in 04',[mPorc],()=>P(R04,159,CAP_BOT-4),'Skutt porcelain kiln insulator ($1.50): body Ø11.2 in the Ø11.5 hole in 04, lip Ø22.1 on the floor, body down out of the oven. Checked clear of 01, the bolts, leg screws and feet. In the controller box the MG wire can land on a steatite block with stainless screws, then normal wire runs to the SSR.'],
 ['Thermocouple',[mTC],()=>P(48,314.6,CZ+8),'The temperature probe goes into the core temp hole (Ø6.4, near the bottom), then down through its own holes in 03 and 04 to the REX-C100.'],
];
const partsEl=document.getElementById('parts'); let fly=null, glow=null;
PARTS_CU.forEach(([name,ms,tf,txt],i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+name;partsEl.appendChild(b);
 b.onclick=()=>{clearInterval(timer);show(STEPS.length-1);setCut(true);
  partsEl.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  const t=tf(); fly={t0:performance.now(),ft:ctl.target.clone(),fp:cam.position.clone(),tt:t,tp:t.clone().add(name==='Thermocouple'?P(75,335,18):P(70,69,16))};
  glow=ms; stxt.innerHTML=`<b>${name}.</b> ${txt}`;}});
const home={t:new THREE.Vector3(0,0,25),p:P(330,159,140)};
document.getElementById('zoom').onclick=e=>{zoomed=!zoomed;e.target.classList.toggle('on',zoomed);
  if(zoomed){setCut(true);const t=P(WIRE_R,159,-14);ctl.target.copy(t);cam.position.copy(t.clone().add(P(120,69,25)))}else{ctl.target.copy(home.t);cam.position.copy(home.p)}};
ctl.target.copy(home.t);cam.position.copy(home.p);
show(STEPS.length-1);
const h=location.hash;
if(h.includes('cut'))bc.click(); if(h.includes('zoom'))document.getElementById('zoom').click(); if(h.includes('play'))document.getElementById('play').click();
const pm=h.match(/part(\d)/); if(pm) partsEl.querySelectorAll('button')[+pm[1]-1].click();
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);lr.setSize(innerWidth,innerHeight)});
(function loop(t){requestAnimationFrame(loop);
  groups.forEach(g=>{if(g.userData.t0){const k=Math.min(1,(t-g.userData.t0)/700);g.position.z=(1-k)*(1-k)*40;if(k>=1)g.userData.t0=0}});
  if(fly){const k=Math.min(1,(t-fly.t0)/900),e=k*k*(3-2*k);ctl.target.lerpVectors(fly.ft,fly.tt,e);cam.position.lerpVectors(fly.fp,fly.tp,e);if(k>=1)fly=null}
  mats.forEach(m=>m.emissive&&m!==mKan&&m.emissive.setHex(0)); mKan.emissive.setHex(0x3a1000);
  if(glow){const a=(Math.sin(t/250)+1)/2;glow.forEach(m=>m.emissive.setRGB(.55*a,.35*a,0))}
  ctl.update();ren.render(scene,cam);lr.render(scene,cam)})();
</script></body></html>
