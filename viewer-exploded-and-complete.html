<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Exploded + Completed — base & lid</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#e8e8ec;overflow:hidden;font-family:-apple-system,sans-serif}
canvas{display:block;width:100vw;height:100vh}
.tag{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:8px 22px;border-radius:9px;font-size:15px;font-weight:600;z-index:5}
.legend{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.68);color:#eee;padding:9px 16px;border-radius:8px;font-size:12.5px;z-index:5;text-align:center}
#loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:18px;color:#666;z-index:20}
</style></head><body>
<div class="tag">Heat &amp; Clean — exploded (back) and completed (front): base + top cap left, lid right</div>
<div id="loading">Loading…</div>
<div class="legend">back row = parts separated &nbsp;·&nbsp; front row = completed assembly &nbsp;·&nbsp; drag to rotate · scroll to zoom</div>
<canvas id="c"></canvas>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const V='?v=ec4';
THREE.Object3D.DEFAULT_UP.set(0,0,1);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setPixelRatio(devicePixelRatio); renderer.setClearColor(0xe8e8ec);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.13;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,9000);
cam.up.set(0,0,1); cam.position.set(230,-760,520);
const ctl=new OrbitControls(cam,renderer.domElement); ctl.enableDamping=true; ctl.target.set(0,0,10);
scene.add(new THREE.AmbientLight(0xffffff,0.95));
const d1=new THREE.DirectionalLight(0xffffff,1.4); d1.position.set(150,200,400); scene.add(d1);
const d2=new THREE.DirectionalLight(0xaabbdd,0.5); d2.position.set(-200,-150,150); scene.add(d2);
scene.add(new THREE.HemisphereLight(0xddeeff,0x888888,0.5));
const loader=new GLTFLoader();
const load=p=>new Promise(res=>loader.load(p,g=>res(g.scene)));
const CHAM='CAD Exports/Core Split/', LID='CAD Exports/Lid Split/';
function paint(o,opt){ o.traverse(ch=>{ if(ch.isMesh){ ch.geometry.deleteAttribute('color'); ch.geometry.computeVertexNormals();
  ch.material=new THREE.MeshStandardMaterial({side:THREE.DoubleSide,...opt}); } }); }
const boltMat=new THREE.MeshStandardMaterial({color:0xd9a521,metalness:0.7,roughness:0.3});
const nutMat =new THREE.MeshStandardMaterial({color:0xc8ccd2,metalness:0.85,roughness:0.3});
const OFF=52.4*Math.PI/180;
function bolt(len,sx,hx,nx){ const s=new THREE.Group();
  const sh=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,len,16),boltMat); sh.rotation.z=Math.PI/2; sh.position.set(sx,0,0);
  const hd=new THREE.Mesh(new THREE.CylinderGeometry(3.2,3.2,2.8,6),boltMat); hd.rotation.z=Math.PI/2; hd.position.set(hx,0,0);
  const nut=new THREE.Mesh(new THREE.CylinderGeometry(3.6,3.6,3,6),nutMat); nut.rotation.z=Math.PI/2; nut.position.set(nx,0,0);
  s.add(sh,hd,nut); return s; }
function ring(z,len,sx,hx,nx){ const g=new THREE.Group();
  for(let k=0;k<6;k++){ const b=bolt(len,sx,hx,nx); b.rotation.z=k*Math.PI/3+OFF; b.position.z=z; g.add(b);} return g; }
function hinge(z){ const g=new THREE.Group();
  const tab=new THREE.Mesh(new THREE.BoxGeometry(14,22,3),new THREE.MeshStandardMaterial({color:0x8a9098,metalness:0.6,roughness:0.4})); tab.position.set(84,0,0);
  const pin=new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.2,26,16),boltMat); pin.rotation.x=Math.PI/2; pin.position.set(84,0,0);
  g.add(tab,pin); g.rotation.z=292.4*Math.PI/180; g.position.z=z; return g; }
function handleBolts(){ const g=new THREE.Group();
  for(const [px,py] of [[7.95,46.5],[-38.3,27.5]]){
    const sh=new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.4,7,14),boltMat); sh.rotation.x=Math.PI/2; sh.position.set(px,py,127);
    const hd=new THREE.Mesh(new THREE.CylinderGeometry(2.6,2.6,1.6,12),boltMat); hd.rotation.x=Math.PI/2; hd.position.set(px,py,130.5);
    g.add(sh,hd);} return g; }
function place(grp,x,y){ const c=new THREE.Box3().setFromObject(grp).getCenter(new THREE.Vector3()); grp.position.set(x-c.x,y-c.y,-c.z); }

function buildChamber(P,exp){ const [ci,co,csup,cs1,cs2,cs3,cbd,ccer,ccap,tcap]=P; const t=exp;
  paint(ci,{color:0xb8bec5,metalness:0.5,roughness:0.4,transparent:t,opacity:t?0.10:1,depthWrite:!t});
  paint(co,{color:0x6f9bd8,metalness:0.4,roughness:0.4,transparent:t,opacity:t?0.08:1,depthWrite:!t});
  paint(csup,{color:0x4f8f7a,metalness:0.55,roughness:0.4});
  [cs1,cs2,cs3].forEach(s=>paint(s,{color:0xe7d9b0,metalness:0,roughness:0.78}));
  paint(cbd,{color:0xe7d9b0,metalness:0,roughness:0.7}); paint(ccer,{color:0xf2f0ea,metalness:0,roughness:0.6});
  paint(ccap,{color:0xdcb48c,metalness:0.55,roughness:0.45});
  cs1.position.z=59+(t?46:0); cs2.position.z=-24-(t?36:0); cs3.position.z=2.15;
  ccap.position.z=t?-44:0; csup.position.z=t?-8:0; tcap.position.z=t?96:0;
  const g=new THREE.Group(); g.add(ci,co,csup,cs1,cs2,cs3,cbd,ccer,ccap,tcap,
    ring(cs1.position.z,t?9.5:13,t?72.5:73.5,t?78.6:80.6,69.35),ring(-24-(t?36:0),13,73.5,80.6,69.35),ring(2.15,9.5,72.5,78.6,69.35)); return g; }

function buildLid(P,exp){ const [li,lo,ltp,lh,lhand,ls1,ls2]=P; const t=exp;
  paint(li,{color:0xb8bec5,metalness:0.5,roughness:0.4,transparent:t,opacity:t?0.12:1,depthWrite:!t});
  paint(lo,{color:0x6f9bd8,metalness:0.4,roughness:0.4,transparent:t,opacity:t?0.10:1,depthWrite:!t});
  paint(ltp,{color:0x4f8f7a,metalness:0.55,roughness:0.4}); paint(lh,{color:0xcfa98a,metalness:0,roughness:0.7});
  paint(lhand,{color:0x9098a0,metalness:0.7,roughness:0.35});
  [ls1,ls2].forEach(s=>paint(s,{color:0xe7d9b0,metalness:0,roughness:0.78}));
  ls1.position.z=119+(t?38:0); ls2.position.z=99-(t?34:0);
  ltp.position.z=t?54:0; lh.position.z=t?-54:0; lhand.position.z=t?104:0;
  const g=new THREE.Group(); g.add(li,lo,ltp,lh,lhand,ls1,ls2,
    ring(ls1.position.z,9.5,72.5,78.6,69.35),ring(ls2.position.z,9.5,72.5,78.6,69.35),hinge(115),handleBolts()); return g; }

const CH=['1_Inner_Wall_Tube','2_Outer_Perforated_Tube','3_Support_Ring_Full','4_Spacer_Ring','4_Spacer_Ring','4_Spacer_Ring','6_Ceramic_Base_Disk','06_Ceramic_Cylinder','02_Bottom_Cap'];
const TCAP='CAD Exports/Individual Parts/GLB/04a_Cap_Shell.glb';
const TRING='CAD Exports/Individual Parts/GLB/04b_Cap_HoldDown_Ring.glb';
const LD=['1_Lid_Inner_Tube','2_Lid_Outer_Perforated_Tube','3_Lid_Top_Disk','4_Lid_Ceramic_Holder','5_Lid_Handle','4_Lid_Spacer','4_Lid_Spacer'];
Promise.all([...CH.map(n=>load(CHAM+n+'.glb'+V)), ...LD.map(n=>load(LID+n+'.glb'+V)), load(TCAP+V), load(TRING+V)]).then(all=>{
  const ch=all.slice(0,9), ld=all.slice(9,16);
  paint(all[16],{color:0x7fbf6a,metalness:0.5,roughness:0.42});
  paint(all[17],{color:0x6fa3d8,metalness:0.5,roughness:0.42});
  const tc=new THREE.Group(); tc.add(all[16],all[17]);
  ch.push(tc);
  const chC=ch.map(s=>s.clone(true)), ldC=ld.map(s=>s.clone(true));   // clones share geometry
  // exploded top cap sits high above the chamber stack; completed it's seated
  const expBase=buildChamber(ch,true);  place(expBase,-130,150); scene.add(expBase);
  const expLid =buildLid(ld,true);      place(expLid, 130,150); scene.add(expLid);
  const cmpBase=buildChamber(chC,false); place(cmpBase,-130,-150); scene.add(cmpBase);
  const cmpLid =buildLid(ldC,false);     place(cmpLid, 130,-150); scene.add(cmpLid);
  const el=document.getElementById('loading'); if(el) el.remove();
});
addEventListener('resize',()=>{ renderer.setSize(innerWidth,innerHeight); cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); });
renderer.setSize(innerWidth,innerHeight);
(function loop(){ requestAnimationFrame(loop); ctl.update(); renderer.render(scene,cam); })();
</script></body></html>
